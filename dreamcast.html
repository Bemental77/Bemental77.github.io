<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Dreamcast (Bemental77)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href=",">
  <!-- Cross-origin isolation for SharedArrayBuffer.
       Without this, sharedMemory creation throws and the worker silently fails. -->
  <script src="/coi-serviceworker.js"></script>
  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #111; color: #ddd;
                 font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    #wrap { display: flex; flex-direction: column; align-items: center; padding: 12px; gap: 8px;
            height: 100vh; box-sizing: border-box; }
    h3   { margin: 0; font-size: 18px; letter-spacing: 1px; color: #aaa; }
    #bar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; justify-content: center; }
    #bar button, #bar label.fileLabel {
      padding: 8px 14px; border: 1px solid #444; background: #222; color: #eee;
      border-radius: 4px; cursor: pointer; font-size: 14px; min-height: 36px;
    }
    #bar button:disabled { opacity: 0.4; cursor: not-allowed; }
    #bar input[type=file] { display: none; }
    #canvasWrap { background: #000; display: flex; align-items: center; justify-content: center;
                  flex: 1; width: 100%; max-width: 100vw; }
    #dc-canvas { background: #000; image-rendering: pixelated; width: 640px; height: 480px;
                 max-width: 100%; max-height: 100%; }
    pre { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px;
          margin: 0; color: #aaa; white-space: pre-wrap; }
    #status { min-width: 220px; text-align: center; }
    #pad    { min-width: 220px; text-align: center; }
    #log    { width: 100%; max-width: 820px; height: 120px; overflow: auto;
              background: #0a0a0a; border: 1px solid #333; padding: 4px; color: #bbb; }
  </style>
</head>
<body>
<div id="wrap">
  <h3>Dreamcast Wasm — Phase 1 single-worker bringup</h3>
  <div id="bar">
    <label class="fileLabel" for="discFile">Choose disc (.cue + .bin tracks)</label>
    <input id="discFile" type="file" multiple accept=".cue,.bin,.gdi,.chd,.cdi,.iso" />
    <button id="btnBoot" disabled>Boot</button>
    <button id="btnReset" disabled>Reset</button>
    <button id="btnSave"  disabled>Save State</button>
    <button id="btnLoad"  disabled>Load State</button>
  </div>
  <pre id="status">Idle.</pre>
  <pre id="pad">pad: -</pre>
  <div id="canvasWrap"><canvas id="dc-canvas" width="640" height="480"></canvas></div>
  <pre id="log"></pre>
</div>
<script>
// =============================================================================
// Phase 1 single-worker bringup for the Flycast Dreamcast WASM core.
//
//   page (this file)
//     |  postMessage  +  shared WebAssembly.Memory
//     v
//   /dreamcast/flycast_libretro/flycast_worker.js  (outer worker JS)
//     |  importScripts
//     v
//   flycast_worker.{js,wasm}  (emcc-generated factory + SH4 JIT inside)
//
// The SH4 JIT (bementalJITSh4) currently runs *inside* flycast_worker via the
// rec_wasm seam — there is no separate sh4-worker yet. Phase 2 (two-worker
// split mirroring gamecube/ppc-worker) will land once Phase 1 sustains
// >=100% native PowerPC-equivalent. Until then this page stays simple:
// one worker, one shared SAB, one rAF loop driving frame paint + pad input.
// =============================================================================
(function () {
  'use strict';
  const $ = (id) => document.getElementById(id);
  const statusEl = $('status'), padEl = $('pad'), logEl = $('log');

  function pageLog(s) {
    if (logEl) {
      logEl.textContent += s + '\n';
      logEl.scrollTop = logEl.scrollHeight;
    }
    console.log(s);
  }
  function setStatus(t) { if (statusEl) statusEl.textContent = t; }

  // ---------------------------------------------------------------------------
  // SAB layout (matches flycast_worker.js):
  //   [0x1F000000 .. 0x1F12C000)  framebuffer (640*480*4 = 1228800 B = 1.17 MB)
  //   [0x1F200000 .. )            audio ring (header 8B + 16384 stereo frames)
  // INITIAL_MEMORY in flycast_worker_link.sh is 512 MB; pick offsets near the
  // top of that range so they don't collide with .data/.bss/heap.
  // ---------------------------------------------------------------------------
  const FB_OFFSET   = 0x1F000000;
  const FB_W = 640, FB_H = 480;
  const FB_BYTES    = FB_W * FB_H * 4;
  const AUDIO_OFFSET = 0x1F200000;
  const AUDIO_FRAMES = 16384;          // power-of-two stereo frames
  const AUDIO_BYTES  = 8 + AUDIO_FRAMES * 2 * 2;  // 8B header + i16 stereo

  // 512 MB shared, 4 GB max — mirrors gamecube allocation.
  const sharedMemory = new WebAssembly.Memory({
    initial: 536870912 / 65536,
    maximum: 4294967296 / 65536,
    shared: true,
  });
  pageLog('[page] sharedMemory allocated (initial=' + (sharedMemory.buffer.byteLength >>> 20) + ' MB)');

  // ---------------------------------------------------------------------------
  // Worker
  // ---------------------------------------------------------------------------
  const worker = new Worker('/dreamcast/flycast_libretro/flycast_worker.js?v=' + Date.now());
  let workerReady = false;
  let discReady   = false;
  let booted      = false;

  worker.onmessage = (e) => {
    const d = e.data || {};
    switch (d.cmd) {
      case 'print':       pageLog(d.txt); break;
      case 'setStatus':   setStatus(d.txt); break;
      case 'ready':
        workerReady = true;
        pageLog('[page] worker ready');
        setStatus('Worker ready. Pick a disc.');
        break;
      case 'discLoaded':
        if (d.success) {
          pageLog('[page] disc loaded ok: ' + d.cuePath);
          setStatus('Disc loaded. Press Boot.');
          $('btnBoot').disabled = false;
        } else {
          pageLog('[page] disc load FAILED: ' + d.cuePath);
          setStatus('Disc load failed.');
        }
        break;
      case 'frame':
        // SAB framebuffer was updated in-place by video_cb. Blit it.
        paintFrame();
        break;
      case 'render':
        // Path B fallback (worker postMessage'd pixels because video target
        // wasn't set). Useful sanity net during early bringup.
        paintTransferable(d);
        break;
      case 'stateSaved':  pageLog('[page] save state ' + (d.data ? d.data.byteLength : 0) + ' B'); break;
      case 'stateLoaded': pageLog('[page] state loaded'); break;
      default:
        // TODO: route flycast bridge cmds (post-js mbx-* etc) once Phase 2 lands.
        pageLog('[page] unknown worker cmd: ' + d.cmd);
    }
  };

  // Hand the worker the SAB first; it forwards to the emcc factory as wasmMemory.
  worker.postMessage({ cmd: 'mem-init', memory: sharedMemory,
                       fbOffset: FB_OFFSET, fbW: FB_W, fbH: FB_H,
                       audioOffset: AUDIO_OFFSET, audioFrames: AUDIO_FRAMES });

  // ---------------------------------------------------------------------------
  // Audio worklet — consumes the SAB ring at AUDIO_OFFSET that the flycast
  // bridge writes from audio_sample_batch_cb. Dreamcast AICA native rate is
  // 44.1 kHz. Browser autoplay policy requires resume() on a user gesture, so
  // the actual ctx.resume() lives in the Boot button handler below.
  // ---------------------------------------------------------------------------
  let audioContext = null;
  let audioNode    = null;
  let audioReady   = false;
  async function initAudio() {
    if (audioContext) return;
    try {
      audioContext = new (self.AudioContext || self.webkitAudioContext)({ sampleRate: 44100 });
      await audioContext.audioWorklet.addModule('/dreamcast/audio-worklet.js');
      audioNode = new AudioWorkletNode(audioContext, 'dc-audio-processor', {
        numberOfInputs: 0,
        numberOfOutputs: 1,
        outputChannelCount: [2],
        processorOptions: {
          sab: sharedMemory.buffer,
          ringOffset: AUDIO_OFFSET,
          ringCapacity: AUDIO_FRAMES,
        },
      });
      audioNode.port.onmessage = (e) => {
        const m = e.data || {};
        if (m.cmd === 'stats' && m.underrunFrames > 0) {
          pageLog('[audio] underrun ' + m.underrunFrames + ' / consumed ' + m.consumedFrames);
        }
      };
      audioNode.connect(audioContext.destination);
      audioReady = true;
      pageLog('[page] audio worklet wired (sr=' + audioContext.sampleRate + ')');
    } catch (err) {
      pageLog('[page] audio init failed: ' + (err && err.message ? err.message : String(err)));
    }
  }

  // ---------------------------------------------------------------------------
  // Disc picker — accept .cue + .bin tracks together. Stream each File as a
  // discChunk, then send discReady with the cue's chosen virtual path.
  // ---------------------------------------------------------------------------
  $('discFile').addEventListener('change', async (ev) => {
    const files = Array.from(ev.target.files || []);
    if (!files.length) return;
    setStatus('Loading disc (' + files.length + ' files)...');
    let cueName = null;
    for (const f of files) {
      const buf = await f.arrayBuffer();
      pageLog('[page] disc chunk: ' + f.name + ' (' + (buf.byteLength/1048576).toFixed(2) + ' MB)');
      worker.postMessage({ cmd: 'discChunk', name: f.name, bytes: buf }, [buf]);
      if (/\.cue$/i.test(f.name) || /\.gdi$/i.test(f.name) || /\.chd$/i.test(f.name) || /\.cdi$/i.test(f.name)) {
        cueName = f.name;
      }
      // ISO single-file path: treat the .iso itself as the boot path.
      if (!cueName && /\.iso$/i.test(f.name)) cueName = f.name;
    }
    if (!cueName) {
      setStatus('No .cue/.gdi/.chd/.cdi/.iso among picked files.');
      return;
    }
    discReady = true;
    worker.postMessage({ cmd: 'discReady', cuePath: '/discs/' + cueName });
  });

  // ---------------------------------------------------------------------------
  // Buttons
  // ---------------------------------------------------------------------------
  $('btnBoot').addEventListener('click', async () => {
    if (!workerReady || !discReady || booted) return;
    booted = true;
    // First user gesture — safe to create + resume the AudioContext now.
    await initAudio();
    if (audioContext && audioContext.state === 'suspended') {
      try { await audioContext.resume(); } catch (_) {}
    }
    setStatus('Booting...');
    [$('btnReset'), $('btnSave'), $('btnLoad')].forEach((b) => b.disabled = false);
    requestAnimationFrame(frameLoop);
  });
  $('btnReset').addEventListener('click', () => {
    worker.postMessage({ cmd: 'reset' });
    setStatus('Reset.');
  });
  $('btnSave').addEventListener('click', () => worker.postMessage({ cmd: 'saveState' }));
  $('btnLoad').addEventListener('click', () => {
    // TODO: wire IndexedDB-backed save slots once Phase 1 reaches stable boot.
    pageLog('[page] loadState UI is a stub — wire IDB after first stable boot');
  });

  // ---------------------------------------------------------------------------
  // rAF loop — packs gamepad → SAB MAPLE buffer, pings worker for one iter.
  // The worker drives its own setInterval-paced run loop too (see
  // flycast_worker.js); this rAF tick is for input + canvas paint pacing.
  // ---------------------------------------------------------------------------
  const canvas = $('dc-canvas');
  const gl = canvas.getContext('webgl2') || canvas.getContext('webgl');
  let glTex = null, glProg = null, glVbo = null;
  if (gl) initGL();
  const ctx2d = gl ? null : canvas.getContext('2d');
  const fbView = new Uint8Array(sharedMemory.buffer, FB_OFFSET, FB_BYTES);

  function paintFrame() {
    if (gl) blitGL(fbView);
    else if (ctx2d) {
      const img = new ImageData(new Uint8ClampedArray(fbView.slice().buffer), FB_W, FB_H);
      ctx2d.putImageData(img, 0, 0);
    }
  }
  function paintTransferable(d) {
    // Path B render fallback. d.pixels is a Uint8Array (XRGB8888).
    if (!d || !d.pixels || !d.w || !d.h) return;
    if (gl) blitGL(d.pixels, d.w, d.h);
    else if (ctx2d) {
      const img = new ImageData(new Uint8ClampedArray(d.pixels.buffer || d.pixels), d.w, d.h);
      ctx2d.putImageData(img, 0, 0);
    }
  }
  function initGL() {
    glTex  = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, glTex);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    const vsSrc = 'attribute vec2 p; varying vec2 t; void main(){ t=vec2(p.x*0.5+0.5,1.0-(p.y*0.5+0.5)); gl_Position=vec4(p,0,1); }';
    const fsSrc = 'precision mediump float; varying vec2 t; uniform sampler2D s; void main(){ vec4 c=texture2D(s,t); gl_FragColor=vec4(c.b,c.g,c.r,1.0); }';
    function sh(type, src) { const o = gl.createShader(type); gl.shaderSource(o, src); gl.compileShader(o); return o; }
    glProg = gl.createProgram();
    gl.attachShader(glProg, sh(gl.VERTEX_SHADER, vsSrc));
    gl.attachShader(glProg, sh(gl.FRAGMENT_SHADER, fsSrc));
    gl.linkProgram(glProg);
    glVbo = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, glVbo);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
  }
  function blitGL(bytes, w, h) {
    w = w || FB_W; h = h || FB_H;
    gl.viewport(0, 0, canvas.width, canvas.height);
    gl.useProgram(glProg);
    gl.bindTexture(gl.TEXTURE_2D, glTex);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, w, h, 0, gl.RGBA, gl.UNSIGNED_BYTE, bytes);
    gl.bindBuffer(gl.ARRAY_BUFFER, glVbo);
    const loc = gl.getAttribLocation(glProg, 'p');
    gl.enableVertexAttribArray(loc);
    gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  }

  // MAPLE-pad layout: 256 bytes — 64 B per port * 4 ports. JS writes button
  // bits (bytes 0..7) and analog axes (bytes 8..63) per port. flycast bridge
  // input_state_cb reads g_maple_pad_state[port*64 + (id/8)] & bit(id%8).
  // We mirror DreamShellInput button IDs (libretro RETRO_DEVICE_ID_JOYPAD_*).
  const RETRO_BUTTONS = {
    B: 0, Y: 1, SELECT: 2, START: 3, UP: 4, DOWN: 5, LEFT: 6, RIGHT: 7,
    A: 8, X: 9, L: 10, R: 11, L2: 12, R2: 13, L3: 14, R3: 15,
  };
  const KEYMAP = {
    [RETRO_BUTTONS.UP]:    'ArrowUp',
    [RETRO_BUTTONS.DOWN]:  'ArrowDown',
    [RETRO_BUTTONS.LEFT]:  'ArrowLeft',
    [RETRO_BUTTONS.RIGHT]: 'ArrowRight',
    [RETRO_BUTTONS.A]:     'x',
    [RETRO_BUTTONS.B]:     'z',
    [RETRO_BUTTONS.X]:     's',
    [RETRO_BUTTONS.Y]:     'd',
    [RETRO_BUTTONS.START]: 'Enter',
    [RETRO_BUTTONS.L]:     'q',
    [RETRO_BUTTONS.R]:     'e',
  };
  const heldKeys = new Set();
  window.addEventListener('keydown', (e) => { heldKeys.add(e.key); });
  window.addEventListener('keyup',   (e) => { heldKeys.delete(e.key); });

  // The maple buffer ptr is allocated in the worker's wasm heap (g_maple_pad_state).
  // The page can't write there directly because the heap pointer lives in the
  // worker's view of the SAB-backed memory. Phase 1: we send pad bytes via
  // postMessage; the worker copies them in. (Phase 2 will move the maple
  // buffer to a known SAB offset for direct Atomics writes from the page.)
  // TODO: cache last padBytes and only postMessage on change to avoid 60 Hz spam.
  function packPad() {
    const bytes = new Uint8Array(256);
    for (const [idStr, key] of Object.entries(KEYMAP)) {
      if (heldKeys.has(key)) {
        const id = +idStr;
        bytes[(id >> 3) | 0] |= (1 << (id & 7));
      }
    }
    const pads = (navigator.getGamepads && navigator.getGamepads()) || [];
    for (let p = 0; p < Math.min(pads.length, 4); p++) {
      const gp = pads[p]; if (!gp) continue;
      const base = p * 64;
      for (let bi = 0; bi < (gp.buttons || []).length && bi < 16; bi++) {
        if (gp.buttons[bi].pressed) bytes[base + (bi >> 3)] |= (1 << (bi & 7));
      }
    }
    return bytes;
  }

  let lastPadHex = '';
  function frameLoop() {
    if (booted) {
      const pad = packPad();
      worker.postMessage({ cmd: 'input', states: pad }, [pad.buffer]);
      worker.postMessage({ cmd: 'runFrame' });
      // Echo first 16 bytes of port-0 pad state for debugging.
      let hex = '';
      for (let i = 0; i < 8; i++) hex += (pad[i] || 0).toString(16).padStart(2, '0');
      if (hex !== lastPadHex) { padEl.textContent = 'pad p0: ' + hex; lastPadHex = hex; }
    }
    requestAnimationFrame(frameLoop);
  }
})();
</script>
</body>
</html>
