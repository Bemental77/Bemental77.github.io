<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Game Boy Advance — Play Online</title>
<!--
  gba_multiplayer.html — THE PARTY, AND THE REMOTE PLAYER'S WHOLE MACHINE.

  ONE browser runs an emulator: the host boots the cartridge, captures its canvas
  and audio and streams both over WebRTC; the remote player sends controller
  state back. The guest needs no core, no ROM and no WebAssembly — a <video> and
  a pad.

  ⚠ A GAME BOY ADVANCE HAS ONE CONTROLLER. This is not a limitation of the port,
  it is the machine: the console is a handheld and its KEYINPUT register is one
  10-bit word. Two GBAs played together over a LINK CABLE, which means two
  emulated machines and a serial transport between them — a different program
  from this one, and one that would need SIO support the shipped core does not
  have.

  MEASURED, not assumed. The core here is 44vba (a VisualBoyAdvance derivative;
  gba/gbaWasm/dist/script.js:1-2 names the upstream). Its ENTIRE wasm export
  table is 20 entries, of which exactly eight are emulator-facing:
      _emuRunFrame  _emuUpdateSavChangeFlag  _emuSetSampleRate  _emuLoadROM
      _emuResetCpu  _emuGetSymbol            _emuSetSaveType    _emuAddCheat
  `_emuRunFrame` has signature (i32) -> void — ONE key mask, no player index — and
  it is the only input entry point (gba/gbaWasm/dist/script.js:297). The two
  wasm->JS callbacks are `writeAudio` and `wasmReady`; there is no link/SIO hook
  of any kind. There is no second port to route anything to.

      WHAT THIS PAGE HONESTLY DOES: the remote player shares THE controller with
      the host. Their buttons are OR'd into the same key mask the host's own
      keyboard, touch and gamepad produce, which is a pass-the-handheld / help-me-
      past-this-boss arrangement, plus a live view of the game. It is NOT two
      players and is not described as one.

  WHAT EACH SIDE DOES
    HOST  picks a game, is given a code, and is handed to
          gba.html?np=<code>&game=<title>, which selects the ROM, presses its own
          Play Game, and hosts under THAT EXACT CODE.
    GUEST stays here. lib/netplay.js's guest retries 'peer-unavailable' rather
          than failing, so joining before the host has loaded is the normal case.
-->
<script src="/lib/netplay.js"></script>
<script src="/lib/netplay-ui.js"></script>
<script src="/lib/netplay-guest.js"></script>
<style>
  /* Only this console's own controls — the shell's CSS is in lib/netplay-guest.js.
     A GBA has two face buttons set on a diagonal, which is what the real machine
     looks like and what the thumb expects. */
  #face { width: 168px; height: 120px; }
  #tA { right: 0;   top: 0;   width: 70px; height: 70px; font-size: 20px; }
  #tB { left: 0;    top: 44px; width: 70px; height: 70px; font-size: 20px; }
  #tL { position: absolute; left: max(14px, env(safe-area-inset-left)); bottom: 178px; width: 74px; height: 44px; }
  #tR { position: absolute; right: max(14px, env(safe-area-inset-right)); bottom: 178px; width: 74px; height: 44px; }
  #tStart  { position: absolute; left: 50%; margin-left: 4px;   bottom: max(18px, env(safe-area-inset-bottom)); width: 86px; height: 40px; }
  #tSelect { position: absolute; left: 50%; margin-left: -94px; bottom: max(18px, env(safe-area-inset-bottom)); width: 86px; height: 40px; }
</style>
</head>
<body>
<script>
'use strict';
(function () {
  // ===========================================================================
  // THE REMOTE PLAYER'S CONTROLLER
  //
  // ⚠ WIRE FORMAT SHARED WITH gba.html — do not drift. lib/netplay.js's sendPad
  // carries ONE int32, and the bits below are the CORE'S OWN key mask, verbatim
  // from gba/gbaWasm/dist/script.js:21:
  //     A 1, B 2, SELECT 4, START 8, RIGHT 16, LEFT 32, UP 64, DOWN 128, R 256, L 512
  // so the host performs no translation: it ORs this mask straight into the value
  // it hands Module._emuRunFrame.
  //
  // ⚠ IT IS ACTIVE-HIGH, which is the INVERSE of the real GBA KEYINPUT register.
  // The core does the inversion internally. Sending the hardware polarity would
  // make "nothing pressed" a nonzero word and every button read backwards.
  // ===========================================================================
  const K = { a: 1, b: 2, select: 4, start: 8, right: 16, left: 32, up: 64, down: 128, r: 256, l: 512 };
  // Keyboard, copied VERBATIM from the defaults gba.html's own InputController
  // ships with (gba/gbaWasm/dist/input_controller.js:44-56) so muscle memory
  // carries between the two pages: d-pad on the arrows, A m, B n, Start Enter,
  // Select v, L q, R e.
  const KEYMAP = {
    up: ['arrowup'], down: ['arrowdown'], left: ['arrowleft'], right: ['arrowright'],
    a: ['m'], b: ['n'], l: ['q'], r: ['e'],
    start: ['enter'], select: ['v'],
  };
  const MAPPED = new Set(Object.values(KEYMAP).flat());
  // Standard-mapping gamepad index -> GBA button.
  const GP = ['a', 'b', null, null, 'l', 'r', null, null, 'select', 'start',
              null, null, 'up', 'down', 'left', 'right'];

  const held = new Set();
  const touched = new Set();
  const stick = { x: 0, y: 0 };
  const norm = (e) => String(e.key || '').toLowerCase();

  function packMask() {
    let m = 0;
    for (const name of Object.keys(KEYMAP)) {
      if (KEYMAP[name].some((k) => held.has(k))) m |= K[name];
    }
    touched.forEach((name) => { m |= K[name]; });

    // The disc is analog on THIS side because a threshold is what makes
    // diagonals reachable with a thumb; it leaves as d-pad bits because that is
    // all a GBA has.
    let ax = stick.x, ay = stick.y;
    const pads = (navigator.getGamepads && navigator.getGamepads()) || [];
    for (let p = 0; p < pads.length; p++) {
      const gp = pads[p]; if (!gp) continue;
      const btns = gp.buttons || [];
      for (let i = 0; i < btns.length && i < GP.length; i++) {
        if (btns[i] && btns[i].pressed && GP[i]) m |= K[GP[i]];
      }
      const a = gp.axes || [], dz = 0.3;
      if (!ax && !ay && a.length >= 2) {
        ax = Math.abs(a[0]) > dz ? a[0] : 0;
        ay = Math.abs(a[1]) > dz ? a[1] : 0;
      }
      break;      // one remote player, one pad
    }
    if (ax > 0.4) m |= K.right;
    if (ax < -0.4) m |= K.left;
    if (ay > 0.4) m |= K.down;
    if (ay < -0.4) m |= K.up;
    return m | 0;
  }

  // ---- the ROM list is a COPY, and the test is what keeps it honest ---------
  // lib/netplay.js refuses a pairing whose game names differ, so both sides must
  // name the same key, and the key is the ROM's TITLE STRING — never its index.
  // CLAUDE.md records an index going stale exactly this way, and this very list
  // has a live example: tools/gba_mobile_controls_test.mjs:58 comments
  // `window.ROMLIST[4]` as "Kirby" when index 4 is Super Bust-A-Move.
  // tools/mp_page_test.mjs compares this list against ROMLIST and FAILS on drift.
  const GAMES = [
    { value: 'Pokemon SoulGold',            label: 'Pokemon SoulGold' },
    { value: 'PKMN Ultra Violet',           label: 'PKMN Ultra Violet' },
    { value: 'Sim City 2000',               label: 'Sim City 2000' },
    { value: 'Sonic Advance 3',             label: 'Sonic Advance 3' },
    { value: 'Super Bust-A-Move',           label: 'Super Bust-A-Move' },
    { value: 'Kirby Nightmare in Dreamland', label: 'Kirby Nightmare in Dreamland' },
    { value: 'Monster Rancher Advance 2',   label: 'Monster Rancher Advance 2' },
  ];

  NetplayGuest.mount({
    seam: '__gbamp',
    title: 'Game Boy Advance — Play Online',
    lede: 'One player loads the game; everyone else watches and joins in. '
        + 'You need no ROM and no download — pick <b>Join</b> on the device you want to play on.',
    sharedNote: '⚠ A Game Boy Advance has <b>one controller</b> — the console is a handheld, and '
              + 'this core exposes a single key mask with no player index. So you and the host '
              + '<b>share the controller</b>: your buttons are added to theirs. That works for '
              + 'taking turns and for helping past a hard bit — it is not two separate players, '
              + 'and we would rather say so than let you find out mid-game.',
    games: GAMES,
    defaultGame: 'Sonic Advance 3',
    hostPage: '/gba.html',
    // ⚠ 3:2, NOT the 4:3 every other page in this family uses. The GBA screen is
    // 240x160 and gba.html pins its canvas to `aspect-ratio: 3 / 2` for exactly
    // this reason; a 4:3 stage here would stretch every sprite.
    aspect: '3 / 2',
    players: 'shared',
    connectedMsg: 'Connected — you share the controller with the host.',
    mapped: MAPPED,
    packMask,
    onKeyDown: (e) => held.add(norm(e)),
    // Release is NEVER filtered: a key that went down while the lobby's code
    // field had focus must still come up, or it stays held on the host's
    // controller forever — a stuck button on somebody else's machine.
    onKeyUp: (e) => held.delete(norm(e)),
    onBlur: () => { held.clear(); touched.clear(); stick.x = stick.y = 0; },
    padHtml:
      '<div id="disc"><div id="nub"></div></div>' +
      '<div id="face"><div class="tb" id="tA">A</div><div class="tb" id="tB">B</div></div>' +
      '<div class="tb sq" id="tL">L</div><div class="tb sq" id="tR">R</div>' +
      '<div class="tb sq" id="tSelect">Select</div><div class="tb sq" id="tStart">Start</div>',
    wirePad({ holdButton, wireDisc, $ }) {
      const b = (id, name) => holdButton($(id), () => touched.add(name), () => touched.delete(name));
      b('tA', 'a'); b('tB', 'b'); b('tL', 'l'); b('tR', 'r');
      b('tStart', 'start'); b('tSelect', 'select');
      wireDisc($('disc'), $('nub'), (x, y) => { stick.x = x; stick.y = y; });
    },
  });
})();
</script>
</body>
</html>
