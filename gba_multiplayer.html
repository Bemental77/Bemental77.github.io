<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>GBA — Online play moved</title>
<!--
  gba_multiplayer.html — A REDIRECT. THERE IS NOTHING ELSE ON THIS PAGE.

  WHAT THIS FILE USED TO BE, AND WHY IT IS GONE.
  It was player 2's WHOLE MACHINE. Exactly one browser in a session ran an
  emulator: the host booted the game, captured its canvas and its audio and
  streamed both over WebRTC, and whoever opened this page sent controller state
  back and watched a <video>. They needed no core, no ROM and no WebAssembly.

  The user cancelled that architecture outright on 2026-09-08 — "WE WILL NOT USE
  STREAMING!", "IT WILL BE AS IF MULTIPLAYER ARE ON THE SAME CONSOLE" — in favour
  of deterministic lockstep: every player runs their own core, only pad bytes
  cross the wire, and each player's own input is applied locally so it is as
  immediate as a local console.

  Under lockstep THERE IS NO SECOND KIND OF MACHINE. Everybody runs the same
  emulator page, so a separate "guest" page has nothing left to be. gba.html now forms LINK-CABLE ROOMS itself (stage GR2, 2026-11-01): its core is mGBA, which
  hosts several linked Game Boy Advances in one wasm instance, so every player runs ALL of them and only 10-bit pad words and one battery image per seat cross
  the wire. Everyone joins first (Party), the host seats each player, and every console loads the game and starts together on frame 0. An earlier version of
  this comment said two GBAs could not be linked on this site; that was true of the previous core (44vba) and has not been true since.

  ⚠ IT IS A REDIRECT RATHER THAN A DELETION so that a link or a QR code someone
  already shared still lands somewhere useful instead of a 404. Any ?np=<code>
  is carried through, because that is what an invitation looks like.
-->
<style>
  html,body{margin:0;height:100%;background:#111;color:#ddd;
    font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    display:flex;align-items:center;justify-content:center;text-align:center}
  div{max-width:34rem;padding:24px}
  a{color:#8cf}
</style>
</head>
<body>
<div>
  <p>Taking you to <a id="go" href="/gba.html">the GBA emulator</a>…</p>
  <p style="color:#888;font-size:13px">Online play now runs on the emulator page itself —
     every player runs their own console (open <b>Party</b> there; the host picks the game).</p>
</div>
<script>
  // Carry an invitation through. `?np=<code>` is how a room is shared, and the
  // emulator page reads exactly that parameter to pre-fill the join box.
  (function () {
    var q = '';
    try {
      var np = new URLSearchParams(location.search).get('np');
      if (np && /^[A-HJ-NP-Z2-9]{5}$/i.test(np)) {
        q = '?np=' + encodeURIComponent(np.toUpperCase());
        // the rest of a lobby hand-off, which gba.html reads: the game's title, host=1 / join=1, the host's seat count, ?net=local (a test rig)
        var p = new URLSearchParams(location.search);
        ['game', 'host', 'join', 'seats', 'net'].forEach(function (k) { if (p.get(k) != null) q += '&' + k + '=' + encodeURIComponent(p.get(k)); });
      }
    } catch (e) {}
    var to = '/gba.html' + q;
    document.getElementById('go').href = to;
    location.replace(to);
  })();
</script>
</body>
</html>
