<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Trainer Center</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <link rel="icon" href="data:," />
  <!-- The Trainer Center is a screen of the Arena's own picture now (/pokemonarena/#center). This address only forwards old links there; it holds no UI. -->
  <script>
    // The test seams of this address ride along (and nothing else of it): a test's net=local must not become the public servers on the way.
    (function () {
      var keep = ['net', 'anim', 'arenaturn', 'arenagrace', 'openquick', 'openchal', 'openjoin', 'openhold', 'opendisc', 'ctrname', 'ctrav'];
      var from = new URLSearchParams(location.search), to = new URLSearchParams();
      for (var i = 0; i < keep.length; i++) if (from.get(keep[i]) !== null) to.set(keep[i], from.get(keep[i]));
      var q = to.toString();
      location.replace('/pokemonarena/' + (q ? '?' + q : '') + '#center');
    })();
  </script>
  <noscript><meta http-equiv="refresh" content="0; url=/pokemonarena/#center" /></noscript>
</head>
<body></body>
</html>
