<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Pokemon Arena - Battle</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="description" content="A Gen-3 style Pokemon battle against a CPU opponent, drawn entirely from the Pokemon SoulGold ROM this site already serves: its sprites, fonts, text boxes, HP bars, menus and messages." />
  <meta name="color-scheme" content="dark" />
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="/pokemonarena/battle.css" />
  <link rel="stylesheet" href="/pokemonarena/input.css" />
  <link rel="stylesheet" href="/pokemonarena/audiobar.css" />
  <!-- The game library's origin: ONE constant for the whole site (see lib/asset_base.js). The ROM URL is built from it in js/romfetch.js. -->
  <script src="/lib/asset_base.js?v=27d8c0a4"></script>
  <!-- Online play (js/online.js): the pairing, the host's approval of the joiner, ICE / relay fallback. Loaded for every battle so the ?v= stamp that tells two
       players on different builds apart is on the page at DOMContentLoaded; tools/stamp_lib_versions.mjs keeps it current. -->
  <script src="/lib/netplay.js?v=d6f2aba1"></script>
</head>
<body data-state="boot" data-layout="portrait" data-pad="off">
  <header id="top">
    <a class="home" id="homeLink" href="/pokemonarena/">&lsaquo; Arena</a>
    <h1>Battle</h1>
    <button id="fullBtn" class="textbtn iconbtn" type="button" aria-pressed="false" aria-label="Fullscreen" title="Fullscreen"><svg class="ic ic-enter" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5" /></svg><svg class="ic ic-exit" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M9 4v5H4M20 9h-5V4M15 20v-5h5M4 15h5v5" /></svg></button>
    <!-- the audio bar (volume, mute): js/audiobar.js fills this in; the same placeholder is in every page's header (no music changer here: the battle picks its music) -->
    <div id="audioBar" class="audiobar" data-page="battle" data-pending="1"></div>
    <div class="tools">
      <button id="soundBtn" class="textbtn" type="button" title="Sound settings: volume, music, effects, soundtrack">Sound: on</button>
      <button id="controlsBtn" class="textbtn" type="button" title="Keyboard, controller and touch settings">Controls</button>
      <button id="menuBtn" class="textbtn" type="button" title="Battle menu (Start)">Menu</button>
      <!-- OPEN TO BATTLES (js/presence_boot.js): hidden until a battle against the CPU is up, invisible until the module has mounted (battle.css, which also draws the broadcast icon: no svg element, so the address-injection test of the page keeps counting none); the module keeps aria-pressed, the tooltip and the glow current -->
      <button id="openBtn" class="textbtn iconbtn" type="button" aria-pressed="false" aria-label="Open to battles" hidden title="Open to battles: list your trainer name and online record on public servers so anyone using Play online can challenge you while you are in the hub or in a battle against the computer. The first time you switch it on, it asks you to confirm."></button>
    </div>
  </header>
  <!-- stands in for the header's Fullscreen button while the header is hidden (fullscreen on a phone held sideways) -->
  <button id="fullExit" class="textbtn iconbtn" type="button" aria-pressed="true" aria-label="Exit fullscreen" title="Exit fullscreen"><svg class="ic ic-exit" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M9 4v5H4M20 9h-5V4M15 20v-5h5M4 15h5v5" /></svg></button>

  <main id="play">
    <div id="dpad" class="cluster" aria-label="Directional pad">
      <button class="pbtn" data-btn="up" id="bUp" aria-label="Up" type="button">&#9650;</button>
      <button class="pbtn" data-btn="left" id="bLeft" aria-label="Left" type="button">&#9664;</button>
      <button class="pbtn" data-btn="right" id="bRight" aria-label="Right" type="button">&#9654;</button>
      <button class="pbtn" data-btn="down" id="bDown" aria-label="Down" type="button">&#9660;</button>
    </div>

    <div id="screenWrap">
      <canvas id="battle" width="240" height="160" tabindex="0" hidden data-input-target aria-label="Battle screen, 240 by 160 pixels. Arrow keys move, Z or Enter confirms, X or Backspace goes back."></canvas>
      <!-- W1 fix A4/A5: the move menu is the one battle screen with no visible way back and no visible way to read a move; these two chips sit over the picture's top-right corner while it is open -->
      <div id="ctxchips" hidden>
        <button id="chipBack" class="chip" type="button" aria-label="Back to the action menu">&lsaquo; Back</button>
        <button id="chipInfo" class="chip" type="button" aria-label="Read the highlighted move's description">Info</button>
      </div>
      <div id="live" class="sr" role="status" aria-live="polite"></div>   <!-- what the Open switch tells a screen reader (presence_boot.js say()): "No longer open to battles." -->
      <div id="boot" role="status">
        <p id="bootText">Starting...</p>
        <progress id="bar" max="1" value="0"></progress>
      </div>
      <div id="error" role="alert" hidden>
        <h2 id="errTitle">The battle could not start</h2>
        <p id="errMsg"></p>
        <p id="errDetail" class="dim"></p>
        <div class="row">
          <button id="retry" type="button" class="textbtn" hidden>Try again</button>
          <a id="quickBtn" class="textbtn" href="/pokemonarena/battle.html">Quick Battle</a>
          <a id="hubBtn" class="textbtn" href="/pokemonarena/">Back to the Arena</a>
        </div>
      </div>
    </div>

    <div id="ab" class="cluster" aria-label="Action buttons">
      <div class="abrow">
        <button class="pbtn small" data-btn="x" id="bX" aria-label="X (info)" type="button">X</button>
        <button class="pbtn small" data-btn="start" id="bStart" aria-label="Menu" type="button">&#9776;</button>
      </div>
      <div class="abrow">
        <button class="pbtn" data-btn="b" id="bB" aria-label="B (back)" type="button">B</button>
        <button class="pbtn" data-btn="a" id="bA" aria-label="A (confirm)" type="button">A</button>
      </div>
    </div>
  </main>

  <!-- a Tower floor's status line (js/battle_boot.js showTowerBar; only in battle.html?tower=1): the floor, the trainer, the buffs held, the lives left -->
  <p id="towerBar" role="status" hidden></p>
  <p id="note" class="dim" hidden></p>
  <p id="keys" class="dim">Arrows or WASD move &middot; Z / Enter = A &middot; X / Backspace = B &middot; C = info &middot; P = menu &middot; hold A or B to type faster &middot; click or tap works too</p>

  <script type="module" src="/pokemonarena/js/battle_boot.js"></script>
</body>
</html>
