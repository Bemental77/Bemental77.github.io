<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Avatar sheet</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>body { margin: 0; background: #e8e4da; } canvas { display: block; image-rendering: pixelated; }</style>
</head>
<body>
  <!-- developer fixture (not linked from any player page): every hair style and hat, in every view and step, so a change to js/avatar.js can be looked at -->
  <canvas id="c"></canvas>
  <script type="module">
    import { drawFrame, encodeAvatar, HAIR_STYLES, HATS, DIRS, SPRITE_W, SPRITE_H } from '../js/avatar.js';
    const P = 4, cell = (SPRITE_W + 2) * P, rowH = (SPRITE_H + 2) * P;
    const looks = [];
    for (let h = 0; h < HAIR_STYLES.length; h++) looks.push({ skin: h % 6, hair: h, hairColor: (h * 3) % 10, hat: 0, hatColor: 0, top: (h * 2) % 12, legs: 9 });
    for (let t = 1; t < HATS.length; t++) looks.push({ skin: t, hair: t % 6, hairColor: t + 1, hat: t, hatColor: (t * 3) % 12, top: (t * 5) % 12, legs: (t * 7) % 12 });
    const cols = DIRS.length * 3;
    const c = document.getElementById('c');
    c.width = cols * cell; c.height = looks.length * rowH;
    const ctx = c.getContext('2d');
    looks.forEach((a, i) => {
      const code = encodeAvatar(a);
      DIRS.forEach((d, j) => { for (let s = 0; s < 3; s++) drawFrame(ctx, code, d, s, (j * 3 + s) * cell + P, i * rowH + P, P); });
    });
    window.__sheet = { done: true, looks: looks.map(encodeAvatar) };
  </script>
</body>
</html>
