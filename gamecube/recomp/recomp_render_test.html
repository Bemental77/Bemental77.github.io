<!doctype html>
<html>
<head><meta charset="utf-8"><title>MP4 recomp — FIFO → WebGPU</title>
<style>body{background:#111;color:#ddd;font:14px monospace;margin:16px} canvas{border:1px solid #444;background:#000}</style>
</head>
<body>
<h3>MP4 recomp: game GX calls → GP-FIFO → decode → WebGPU</h3>
<canvas id="c" width="480" height="480"></canvas>
<pre id="log"></pre>
<script type="module">
import { decodeFifo } from './fifo_decode.mjs';
const log = (...a)=>{ document.getElementById('log').textContent += a.join(' ')+'\n'; console.log(...a); };
try {
  // 1) instantiate the recompiled MP4 module (host imports stubbed for this render test)
  const mod = await WebAssembly.compileStreaming(fetch('./mp4_dec.wasm'));
  const imp = {};
  for (const i of WebAssembly.Module.imports(mod)) {
    imp[i.module] ??= {};
    if (i.kind==='function') imp[i.module][i.name] = ()=>0;
    else if (i.kind==='memory') imp[i.module][i.name] = new WebAssembly.Memory({initial:512, maximum:32768});
    else if (i.kind==='global') imp[i.module][i.name] = 0;
    else if (i.kind==='table') imp[i.module][i.name] = new WebAssembly.Table({initial:256, element:'funcref'});
  }
  const ex = (await WebAssembly.instantiate(mod, imp)).exports;
  const mem = (Object.values(ex).find(v=>v instanceof WebAssembly.Memory)).buffer;

  // 2) drive REAL GX calls through the recompiled game's write-gather-pipe: a colored
  //    DIRECT triangle. gx_wgpipe_* are the game's own inline vertex writers (GXVert.h shim).
  ex.gx_fifo_reset();
  ex.gx_wgpipe_u8(0x08); ex.gx_wgpipe_u8(0x50); ex.gx_wgpipe_u32(((1<<9)|(1<<13))>>>0); // VCD: pos+clr DIRECT
  ex.gx_wgpipe_u8(0x90); ex.gx_wgpipe_u16(3);                                            // GX_DRAW_TRIANGLES, 3 verts
  const tri = [[0,0.8,0, 224,32,32,255],[-0.8,-0.75,0, 32,224,64,255],[0.8,-0.75,0, 48,96,240,255]];
  for (const v of tri){ ex.gx_wgpipe_f32(v[0]);ex.gx_wgpipe_f32(v[1]);ex.gx_wgpipe_f32(v[2]);
                        ex.gx_wgpipe_u8(v[3]);ex.gx_wgpipe_u8(v[4]);ex.gx_wgpipe_u8(v[5]);ex.gx_wgpipe_u8(v[6]); }
  const pos = ex.gx_fifo_pos(), base = ex.gx_fifo_base();
  log('FIFO emitted:', pos, 'bytes');

  // 3) decode the GP-FIFO byte stream into draw commands
  const { cmds, clean } = decodeFifo(new DataView(mem, base, pos), pos, {posDirect:true, posComps:3, clrDirect:true});
  const draw = cmds.find(c=>c.t==='draw');
  log('decoded clean:', clean, '| draw:', draw.prim, draw.nverts, 'verts');

  // 4) render the decoded triangle with WebGPU
  if (!navigator.gpu) { log('WebGPU unavailable'); throw new Error('no webgpu'); }
  const adapter = await navigator.gpu.requestAdapter();
  const device = await adapter.requestDevice();
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('webgpu');
  const fmt = navigator.gpu.getPreferredCanvasFormat();
  ctx.configure({ device, format: fmt, alphaMode:'opaque' });

  // interleave decoded pos (xyz) + color (rgba, normalized) into a vertex buffer
  const verts = new Float32Array(draw.nverts * 7);
  for (let i=0;i<draw.nverts;i++){ const p=draw.positions[i], c=draw.colors[i];
    verts.set([p[0],p[1],p[2], c[0]/255,c[1]/255,c[2]/255,c[3]/255], i*7); }
  const vbuf = device.createBuffer({ size:verts.byteLength, usage:GPUBufferUsage.VERTEX|GPUBufferUsage.COPY_DST });
  device.queue.writeBuffer(vbuf, 0, verts);

  const shader = device.createShaderModule({ code:`
    struct VOut { @builtin(position) pos:vec4f, @location(0) col:vec4f };
    @vertex fn vs(@location(0) p:vec3f, @location(1) c:vec4f) -> VOut {
      var o:VOut; o.pos = vec4f(p, 1.0); o.col = c; return o; }
    @fragment fn fs(@location(0) c:vec4f) -> @location(0) vec4f { return c; }` });
  const pipe = device.createRenderPipeline({ layout:'auto',
    vertex:{ module:shader, entryPoint:'vs', buffers:[{ arrayStride:28,
      attributes:[{shaderLocation:0,offset:0,format:'float32x3'},{shaderLocation:1,offset:12,format:'float32x4'}] }] },
    fragment:{ module:shader, entryPoint:'fs', targets:[{format:fmt}] },
    primitive:{ topology:'triangle-list' } });

  const enc = device.createCommandEncoder();
  const pass = enc.beginRenderPass({ colorAttachments:[{ view:ctx.getCurrentTexture().createView(),
    clearValue:{r:0.06,g:0.06,b:0.09,a:1}, loadOp:'clear', storeOp:'store' }] });
  pass.setPipeline(pipe); pass.setVertexBuffer(0, vbuf); pass.draw(draw.nverts); pass.end();
  device.queue.submit([enc.finish()]);
  await device.queue.onSubmittedWorkDone();
  log('RENDERED ✓  (game FIFO → decoder → WebGPU)');
  document.title = 'RECOMP_RENDER_OK';
} catch(e){ log('ERROR:', e.message); document.title = 'RECOMP_RENDER_FAIL: '+e.message; }
</script>
</body>
</html>
