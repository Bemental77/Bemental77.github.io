<!doctype html><html><head><meta charset=utf8><title>RECOMP_LIVE</title>
<style>body{background:#222;color:#ccc;font:13px monospace;margin:12px}canvas{border:1px solid #444;background:#000;image-rendering:pixelated}#log{white-space:pre;max-height:160px;overflow:auto}</style>
</head><body>
<h3>MP4 decomp&rarr;wasm native port &mdash; live boot logo (recompiled game code running in-browser)</h3>
<canvas id=c width=640 height=480></canvas>
<div id=log></div>
<script type=module>
import { decodeFifo } from './fifo_decode.mjs';
const L = (s) => { document.getElementById('log').textContent += s + '\n'; };

// ---- host-import stubs (ported from fiber_probe.mjs; the logo path is DVD-free) ----
let Module = null, viRetrace = 0; const frames = [];
const wasmBinary = new Uint8Array(await (await fetch('./mp4_game.wasm')).arrayBuffer());
const wasmModule = await WebAssembly.compile(wasmBinary);
const fstRaw = new Uint8Array(await (await fetch('./mp4_fst.bin')).arrayBuffer());
const isEmscripten = (n) => n.startsWith('emscripten_')||n.startsWith('__asyncify')||n.startsWith('asyncify_')||n.startsWith('__wasm')||n.startsWith('invoke_')||n==='memory'||
  /^(_?abort|_?assert|proc_exit|fd_write|fd_read|fd_close|fd_seek|environ_get|environ_sizes_get|_tzset_js|_localtime_js|_gmtime_js|_mktime_js|emscripten_date_now|_emscripten_get_now_is_monotonic|getentropy|_setitimer_js|__syscall_.*|segfault|__stack_chk_fail|_munmap_js|_mmap_js|__cxa_.*|setTempRet0|getTempRet0|__handle_stack_overflow|_emscripten_memcpy_js|_emscripten_runtime_keepalive_clear)$/.test(n);
const hostNames = [];
for (const imp of WebAssembly.Module.imports(wasmModule))
  if (imp.kind==='function' && (imp.module==='env'||imp.module==='wasi_snapshot_preview1') && !isEmscripten(imp.name)) hostNames.push(imp.name);

const PUMP_MAX = 14;
function stub(n) { return (...a) => {
  if (n==='OSInit') { Module._OSSetArenaLo(0x80004000); Module._OSSetArenaHi(0x81800000); return 0; }
  if (n==='OSGetTime'||n==='__OSGetSystemTime') return BigInt(Math.floor(performance.now()*40500));
  if (n==='OSGetTick') return (performance.now()*40500)>>>0;
  if (n==='OSGetResetCode') return 0;
  if (n==='OSDisableInterrupts'||n==='OSEnableInterrupts'||n==='OSRestoreInterrupts') return 0;
  if (n==='DVDInit') { const f=Module.___DVDFSInit||Module.__DVDFSInit; if(f) f(); return 0; }
  if (n==='DVDReadAbsAsyncPrio'||n==='DVDReadAbsAsyncForBS') { const dv=new DataView(Module.wasmMemory.buffer); dv.setInt32((a[0]>>>0)+12,0,true); dv.setUint32((a[0]>>>0)+32,(a[2]|0)>>>0,true); return 1; }
  if (n==='VIWaitForRetrace') { viRetrace++; const pos=Module._gx_fifo_pos(), base=Module._gx_fifo_base();
    frames.push(pos>0 ? new Uint8Array(Module.wasmMemory.buffer.slice(base, base+pos)) : null);
    Module._gx_fifo_reset(); if (viRetrace>=PUMP_MAX) throw {__done:true}; return 0; }
  return 0;
};}
const instantiateWasm = (info, receive) => { info.env ??= {};
  for (const n of hostNames) info.env[n] = stub(n);
  WebAssembly.instantiate(wasmModule, info).then(i => receive(i, wasmModule)); return {}; };

const createModule = (await import('./mp4_game.js')).default;
Module = await createModule({ instantiateWasm, noInitialRun: true });
if (Module.wasmMemory.buffer.byteLength < 0x82000000) Module._emscripten_resize_heap(0x82000000);
// stage BootInfo (LE!) + FST (byte-swap entries) + FSTLocation
const d = new DataView(Module.wasmMemory.buffer);
d.setUint32(0x80000000, 0x0D15EA5E, true); d.setUint32(0x80000008, 0x01800000, true); d.setUint32(0x80000014, 2, true);
const FST_ADDR = 0x81C00000; const fst = fstRaw.slice();
const fdv = new DataView(fst.buffer); const maxEntry = fdv.getUint32(8, false); const eb = maxEntry*12;
for (let i=0;i+4<=eb;i+=4) fdv.setUint32(i, fdv.getUint32(i,false), true);   // BE->LE the entry table
new Uint8Array(Module.wasmMemory.buffer).set(fst, FST_ADDR);
d.setUint32(0x80000038, FST_ADDR, true); d.setUint32(0x8000003C, fst.length, true);
L('module instantiated; running main()...');
try { await Module._main(); } catch(e){ if(!e.__done) L('main stopped: '+(e.message||e)); }
L('pumped '+viRetrace+' frames');

// ---- pick the frame with the logo draw + extract the texture ----
let best=null, bestN=0;
for (const fb of frames) { if(!fb) continue; const {cmds}=decodeFifo(new DataView(fb.buffer,fb.byteOffset,fb.length),fb.length);
  const nd = cmds.filter(c=>c.t==='draw'&&c.positions).length; if (nd>=bestN && fb.length>500){ best={fb,cmds}; bestN=nd; } }
const draws = best ? best.cmds.filter(c=>c.t==='draw'&&c.positions) : [];
const vpc = best && best.cmds.find(c=>c.t==='xf'&&c.addr===0x101a); const hW=vpc?Math.abs(vpc.data[0]):320, hH=vpc?Math.abs(vpc.data[1]):240;
L('best frame draws='+draws.length);
// texture from AnimBmpData (C8 + RGB5A3 palette), decoded live
const getA = Module.___recomp_get_animtree||Module.__recomp_get_animtree; const aP = getA?(getA()>>>0):0;
let texRGBA=null, texW=0, texH=0;
if (aP) { const m=new DataView(Module.wasmMemory.buffer); const bmpP=m.getUint32(aP+0x10,true)>>>0;
  texW=m.getInt16(bmpP+4,true); texH=m.getInt16(bmpP+6,true); const dataP=m.getUint32(bmpP+0x10,true)>>>0, palP=m.getUint32(bmpP+0xC,true)>>>0;
  const tex=new Uint8Array(Module.wasmMemory.buffer,0,0); const mem=new Uint8Array(Module.wasmMemory.buffer);
  const pal=new DataView(Module.wasmMemory.buffer); texRGBA=new Uint8Array(texW*texH*4); const txW=texW/8;
  for(let y=0;y<texH;y++)for(let x=0;x<texW;x++){ const tx=x>>3,ty=y>>2,ix=x&7,iy=y&3; const off=dataP+(ty*txW+tx)*32+iy*8+ix; const idx=mem[off];
    const pv=pal.getUint16(palP+idx*2,false); let r,g,b,a; if(pv&0x8000){a=255;r=((pv>>10)&31)*255/31;g=((pv>>5)&31)*255/31;b=(pv&31)*255/31;}else{a=((pv>>12)&7)*255/7;r=((pv>>8)&15)*255/15;g=((pv>>4)&15)*255/15;b=(pv&15)*255/15;}
    const o=(y*texW+x)*4; texRGBA[o]=r;texRGBA[o+1]=g;texRGBA[o+2]=b;texRGBA[o+3]=a; }
  L('texture '+texW+'x'+texH+' C8 decoded live'); }

// ---- WebGPU render the textured logo quad (real geometry + real texture) ----
const cv=document.getElementById('c');
if (!navigator.gpu) { L('WebGPU unavailable'); document.title='NO_WEBGPU'; }
else if (!draws.length) { L('no draws to render'); document.title='RECOMP_LIVE_NODRAW'; }
else {
  const dev=await (await navigator.gpu.requestAdapter()).requestDevice(); const ctx=cv.getContext('webgpu'); const fmt=navigator.gpu.getPreferredCanvasFormat();
  ctx.configure({device:dev,format:fmt,alphaMode:'opaque'});
  const logo=draws.find(dw=>dw.positions[0].length===3)||draws[0];
  const ndc=logo.positions.map(p=> p.length===3?[p[0]/hW,p[1]/hH]:[p[0]/hW-1,1-p[1]/hH]);
  const uv=[[0,1],[1,1],[1,0],[0,0]]; const V=[]; for(const i of [0,1,2,0,2,3]) V.push(ndc[i][0],ndc[i][1],uv[i][0],uv[i][1]);
  const vb=dev.createBuffer({size:V.length*4,usage:GPUBufferUsage.VERTEX|GPUBufferUsage.COPY_DST}); dev.queue.writeBuffer(vb,0,new Float32Array(V));
  let tex,smp; if(texRGBA){ tex=dev.createTexture({size:[texW,texH],format:'rgba8unorm',usage:GPUTextureUsage.TEXTURE_BINDING|GPUTextureUsage.COPY_DST});
    dev.queue.writeTexture({texture:tex},texRGBA,{bytesPerRow:texW*4},[texW,texH]); smp=dev.createSampler({magFilter:'linear',minFilter:'linear'}); }
  const sh=dev.createShaderModule({code:`struct VO{@builtin(position)pos:vec4f,@location(0)uv:vec2f};
    @vertex fn vs(@location(0)p:vec2f,@location(1)uv:vec2f)->VO{var o:VO;o.pos=vec4f(p,0,1);o.uv=uv;return o;}
    @group(0)@binding(0)var s:sampler;@group(0)@binding(1)var t:texture_2d<f32>;
    @fragment fn fs(i:VO)->@location(0)vec4f{return textureSample(t,s,i.uv);}`});
  const pipe=dev.createRenderPipeline({layout:'auto',vertex:{module:sh,entryPoint:'vs',buffers:[{arrayStride:16,attributes:[{shaderLocation:0,offset:0,format:'float32x2'},{shaderLocation:1,offset:8,format:'float32x2'}]}]},fragment:{module:sh,entryPoint:'fs',targets:[{format:fmt}]},primitive:{topology:'triangle-list'}});
  const bg=dev.createBindGroup({layout:pipe.getBindGroupLayout(0),entries:[{binding:0,resource:smp},{binding:1,resource:tex.createView()}]});
  const enc=dev.createCommandEncoder(); const pass=enc.beginRenderPass({colorAttachments:[{view:ctx.getCurrentTexture().createView(),clearValue:{r:1,g:1,b:1,a:1},loadOp:'clear',storeOp:'store'}]});
  pass.setPipeline(pipe);pass.setBindGroup(0,bg);pass.setVertexBuffer(0,vb);pass.draw(6);pass.end(); dev.queue.submit([enc.finish()]); await dev.queue.onSubmittedWorkDone();
  L('rendered live'); document.title='RECOMP_LIVE_DONE';
}
</script></body></html>
