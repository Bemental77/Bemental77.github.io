<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>ppc-worker dispatch microbench (L0 / L1 / L2)</title>
<!--
  Topic: gamecube/docs/native-speed-gap-test/TASKS.md
  Loads ONLY ppc-worker (no dolphin_worker, no mailbox, no canvas, no audio).
  Measures three dispatch boundaries against one fixture block:
    L0  empty EM_ASM_INT loop                    (floor of any C→JS crossing)
    L1  dispatch_raw(handle)                     (production EM_ASM-wrapped path)
    L2  C-direct via fn-ptr cast on wasmTable    (toolchain lowers to call_indirect)
-->
<!-- /coi-serviceworker.js intentionally omitted: the headless driver
     (run_microbench.js) serves COOP/COEP headers natively. When opening
     this page via `npm run web`, the site-level coi-serviceworker.js
     installs the same headers on first reload. -->

<style>
  body { font: 13px/1.4 -apple-system, monospace; padding: 16px; max-width: 820px; }
  h1 { font-size: 16px; margin: 0 0 8px; }
  .meta { color: #666; margin-bottom: 12px; }
  button { font: inherit; padding: 6px 14px; margin: 0 6px 6px 0; cursor: pointer; }
  pre { background: #f4f4f4; padding: 12px; overflow: auto; border-radius: 4px; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: 6px 0; }
  label { color: #444; }
  input[type=number] { width: 110px; font: inherit; padding: 3px 5px; }
  .ok  { color: #1a6; } .err { color: #c33; } .wait { color: #999; }
</style>
</head>
<body>
<h1>ppc-worker dispatch microbench — L0 / L1 / L2</h1>
<div class="meta">
  Topic: <code>gamecube/docs/native-speed-gap-test/TASKS.md</code>.
  Cross-origin isolation: <span id="coi">…</span>.
  Worker: <span id="winit">spawning…</span>
</div>

<div class="row">
  <label>Warmup iters: <input id="warmup" type="number" value="200000"></label>
  <label>Measure iters: <input id="iters"  type="number" value="2000000"></label>
  <label>Trials: <input id="trials" type="number" value="3"></label>
</div>
<div class="row">
  <button id="run-l0">Run L0 (empty EM_ASM)</button>
  <button id="run-l1">Run L1 (dispatch_raw)</button>
  <button id="run-l2">Run L2 (C-direct)</button>
  <button id="run-all">Run ALL (L0 → L1 → L2)</button>
  <button id="copy-json">Copy JSON</button>
</div>

<h3>Results</h3>
<pre id="out" class="wait">no results yet — click Run.</pre>

<script type="module" src="./microbench.js"></script>
</body>
</html>
