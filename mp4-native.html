<meta name="description" content="Mario Party 4 as a source port for the web: the decomp's PC port (Party Board) on Aurora, compiled to WebAssembly + WebGPU.">
<style>
  :root { --bg: #f6f5f2; --fg: #1d1d1f; --muted: #6b6b70; --panel: #ffffff; --line: #dedcd6; --accent: #c4302b; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #121214; --fg: #ececee; --muted: #9a9aa2; --panel: #1c1c20; --line: #2e2e34; --accent: #ff5b52; }
  }
  :root[data-theme="dark"] { --bg: #121214; --fg: #ececee; --muted: #9a9aa2; --panel: #1c1c20; --line: #2e2e34; --accent: #ff5b52; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 980px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  p.sub { margin: 0 0 16px; color: var(--muted); }
  .stage { background: #000; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; aspect-ratio: 4 / 3; position: relative; }
  canvas#canvas { width: 100%; height: 100%; display: block; }
  .bar { display: flex; gap: 12px; align-items: center; margin-top: 12px; flex-wrap: wrap; }
  button { background: var(--accent); color: #fff; border: 0; border-radius: 6px; padding: 9px 18px; font: inherit; font-weight: 600; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  #status { color: var(--muted); font-variant-numeric: tabular-nums; }
  .readout { margin-top: 10px; font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--fg); font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
  .readout b { font-weight: 600; }
  .readout .warn { color: var(--accent); }
  .note { margin-top: 12px; padding: 12px 14px; border: 1px solid var(--line); border-left: 4px solid var(--accent); border-radius: 6px; background: var(--panel); }
  .note a { color: var(--accent); font-weight: 600; }
  .keys { margin-top: 6px; color: var(--muted); font-size: 13px; }
  .keys kbd { font: 12px ui-monospace, monospace; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; background: var(--panel); }
  pre#log { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 10px; max-height: 220px; overflow: auto; font-size: 12px; margin-top: 12px; white-space: pre-wrap; }

<body>
<main>
  <h1>Mario Party 4 &mdash; native port</h1>
  <p class="sub">The decompiled game compiled straight to WebAssembly, drawing through WebGPU. No emulator.</p>
  <div class="stage"><canvas id="canvas" tabindex="0" oncontextmenu="event.preventDefault()"></canvas></div>
  <div class="bar">
    <button id="btnStart">Start</button>
    <button id="btnRoomGo" hidden>Start the party now</button>
    <span id="status">Idle</span>
  </div>
  <div class="note" id="capNote" role="status" hidden></div>
  <div class="readout" id="readout" aria-live="off"></div>
  <div class="keys">Move <kbd>&larr;&uarr;&darr;&rarr;</kbd>/<kbd>WASD</kbd> &middot; A <kbd>Space</kbd>/<kbd>X</kbd> &middot; B <kbd>Z</kbd> &middot; X <kbd>C</kbd> &middot; Y <kbd>V</kbd> &middot; L/R <kbd>Q</kbd>/<kbd>E</kbd> &middot; Z <kbd>Shift</kbd> &middot; Start <kbd>Enter</kbd> &middot; C-stick <kbd>IJKL</kbd> &middot; D-pad <kbd>TFGH</kbd> &middot; gamepads work too</div>
  <pre id="log"></pre>
</main>
<script>
(function () {
  'use strict';
  var Q = new URLSearchParams(location.search);
  // Two builds of the same module: dist/ (solo) and dist/rb/ (with the rollback write barrier, which
  // costs CPU every frame — loaded only by a room, or with ?rb=1 for the rollback self-test).
  var BUILD = Q.get('build') || 'gamecube/native/dist/';
  // Solo on a browser with JSPI (WebAssembly.Suspending, Chrome 137+): dist/jspi/ — libco's fibers and
  // the frame sleep run on JSPI, nothing is Asyncify-instrumented (?jspi=0 forces the Asyncify build).
  // A room always loads dist/rb/ (Asyncify: a paused fiber must live in memory to be rolled back).
  function hasJspi() { try { return typeof WebAssembly.Suspending === 'function' && typeof WebAssembly.promising === 'function'; } catch (e) { return false; } }
  function buildFor(room) {
    if (Q.get('build')) return Q.get('build');
    if (room || Q.get('rb') === '1') return 'gamecube/native/dist/rb/';
    if (Q.get('jspi') !== '0' && hasJspi()) return 'gamecube/native/dist/jspi/';
    return 'gamecube/native/dist/';
  }
  var PARTS = ['a', 'b', 'c', 'd', 'e', 'f'];
  var logEl = document.getElementById('log'), statusEl = document.getElementById('status');
  var btn = document.getElementById('btnStart');
  var lines = [];
  // the on-page log is redrawn at most once a frame: some minigames (m449) print ~300 lines a second,
  // and a textContent rewrite + scrollTop read per line forced a layout each time (m449 ran at ~0.5x)
  var logDirty = false;
  function logFlush() { logDirty = false; logEl.textContent = lines.join('\n'); logEl.scrollTop = logEl.scrollHeight; }
  function log(s) {
    console.log('[mp4n] ' + s);
    lines.push(s); if (lines.length > 400) lines.shift();
    if (!logDirty) { logDirty = true; requestAnimationFrame(logFlush); }
  }
  function status(s) { statusEl.textContent = s; }
  window.__mp4n = { phase: 'idle', errors: [] };

  // fetch + inflate one gzipped part in a worker (the inflate would otherwise block this thread)
  var inflateSrc = 'self.onmessage=function(e){(async function(){try{var r=await fetch(e.data);' +
    'if(!r.ok)throw new Error(e.data+" -> "+r.status);' +
    'var b=await new Response(r.body.pipeThrough(new DecompressionStream("gzip"))).arrayBuffer();' +
    'self.postMessage({buf:b},[b]);}catch(x){self.postMessage({err:String(x&&x.message||x)});}})();};';
  function inflate(url) {
    return new Promise(function (resolve, reject) {
      var w = new Worker(URL.createObjectURL(new Blob([inflateSrc], { type: 'text/javascript' })));
      w.onmessage = function (e) { w.terminate(); e.data.err ? reject(new Error(e.data.err)) : resolve(e.data.buf); };
      w.postMessage(new URL(url, location.href).href);
    });
  }

  function loadScript(src) {
    return new Promise(function (resolve, reject) {
      var s = document.createElement('script'); s.src = src; s.onload = resolve;
      s.onerror = function () { reject(new Error('could not load ' + src)); };
      document.head.appendChild(s);
    });
  }

  // Audio: the game renders each guest frame's samples (32 kHz stereo s16) and hands them over here;
  // they are scheduled back to back on the AudioContext clock. If the queue runs dry it restarts a
  // little ahead (a gap, never a speed change); if it runs far ahead (host clock faster than the
  // audio clock) a chunk is dropped.
  var audio = { ctx: null, next: 0, pushed: 0, nonSilent: 0, peak: 0, gaps: 0, drops: 0, muted: 0 };
  window.__mp4n.audio = audio;
  if (Q.get('audrec')) { audio.rec = new Int16Array(32000 * 2 * (+Q.get('audrec') || 20)); audio.recLen = 0; }  // probe: keep the first N s
  function audioInit() {
    try {
      var AC = window.AudioContext || window.webkitAudioContext;
      audio.ctx = new AC({ sampleRate: 32000, latencyHint: 'interactive' });
    } catch (e) {
      try { audio.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e2) { audio.ctx = null; }
    }
    if (audio.ctx && audio.ctx.state === 'suspended') audio.ctx.resume();
    audioWorkletInit();
  }
  // THE AUDIO SPLIT (musyx hw_pc_split.h). The game's MusyX runs everything the game can observe and,
  // once per guest frame, hands over a log of the sample-level work (Module.mp4AudioLog); the audio
  // module (gamecube/native/dist/audio/mp4audio.wasm, the same MusyX sources built as the render half)
  // replays it into PCM. Its home is the AudioWorklet: logs go there through a SharedArrayBuffer ring
  // when the page is cross-origin isolated, else one transferred message per frame, and the worklet
  // plays what it renders. If the worklet cannot run it (no AudioWorklet, a context not at 32 kHz, not
  // loaded yet, ?audrec recording) a main-thread instance renders and the PCM path below plays it.
  // A frame the page does not replay (a re-simulated or hidden room frame) is a serial gap: the next
  // replayed frame resyncs the voices from its snapshot (decoder history restarts at zero there).
  // Starving never blocks anything: an empty queue plays silence until 50 ms is buffered again.
  function mkAudio(mod) {
    var inst = new WebAssembly.Instance(mod, { env: { emscripten_notify_memory_growth: function () {} } });
    var e = inst.exports; if (e._initialize) e._initialize();
    var inPtr = 0, inCap = 0, outFrames = 32000, outPtr = e.malloc(outFrames * 4);
    return {
      render: function (u8) {
        if (u8.length > inCap) { if (inPtr) e.free(inPtr); inCap = Math.max(65536, u8.length * 2); inPtr = e.malloc(inCap); }
        new Uint8Array(e.memory.buffer, inPtr, u8.length).set(u8);
        var n = e.salPCRenderLog(inPtr, u8.length, outPtr, outFrames);
        return new Int16Array(e.memory.buffer, outPtr, n * 2);
      },
      stats: function () { return Array.prototype.slice.call(new Uint32Array(e.memory.buffer, e.salPCRenderStats(), 8)); }
    };
  }
  // the log ring (cross-origin isolated): [u32 len][bytes, padded to 4] entries; Int32 head = bytes written, bytes read
  var RING = 1 << 20;
  function ringWrite(r, u8) {
    var need = 4 + ((u8.length + 3) & ~3), w = Atomics.load(r.h, 0), rd = Atomics.load(r.h, 1);
    if (RING - (w - rd) < need) return false;
    var hdr = new Uint8Array(4); new DataView(hdr.buffer).setUint32(0, u8.length, true);
    ringCopyIn(r.d, w, hdr); ringCopyIn(r.d, w + 4, u8);
    Atomics.store(r.h, 0, w + need);
    return true;
  }
  function ringCopyIn(d, at, src) { var o = at & (RING - 1), a = Math.min(src.length, RING - o); d.set(src.subarray(0, a), o); if (a < src.length) d.set(src.subarray(a), 0); }
  // the worklet: plays PCM chunks (Float32Array messages: the single-module builds and the main-thread
  // fallback) and, once it has the audio module, renders the logs itself
  function audioWorkletInit() {
    var ctx = audio.ctx;
    if (!ctx || !ctx.audioWorklet || typeof AudioWorkletNode === 'undefined' || ctx.sampleRate !== 32000) return;
    var src = mkAudio.toString() + 'var this_RING=' + RING + ';' +
      'class P extends AudioWorkletProcessor{constructor(){super();this.q=[];this.h=0;this.avail=0;this.prime=true;this.used=0;this.gaps=0;this.drops=0;this.t=0;this.a=null;this.ring=null;this.logs=0;this.pushed=0;this.nonSilent=0;this.peak=0;' +
      'this.port.onmessage=(e)=>{var d=e.data;if(d instanceof Float32Array){this.q.push(d);this.avail+=d.length>>1;}' +
      'else if(d.mod){try{this.a=mkAudio(new WebAssembly.Module(d.mod));if(d.sab)this.ring={h:new Int32Array(d.sab,0,2),d:new Uint8Array(d.sab,8,this_RING)};this.echo=!!d.echo;this.port.postMessage({ready:1});}catch(x){this.port.postMessage({fail:String(x)});}}' +
      'else if(d.log)this.feed(new Uint8Array(d.log));};}' +
      'feed(u8){if(!this.a)return;var pcm=this.a.render(u8);this.logs++;var n=pcm.length>>1;if(!n)return;if(this.echo)this.port.postMessage({pcm:pcm.slice()});var pk=0,i;' +
      'for(i=0;i<pcm.length;i++){var v=pcm[i]<0?-pcm[i]:pcm[i];if(v>pk)pk=v;}this.pushed+=n;if(pk>64)this.nonSilent+=n;if(pk>this.peak)this.peak=pk;' +
      'if(this.avail+n>9600){this.drops++;return;}var f=new Float32Array(n*2);for(i=0;i<n*2;i++)f[i]=pcm[i]/32768;this.q.push(f);this.avail+=n;}' +
      'poll(){var r=this.ring;if(!r)return;var w=Atomics.load(r.h,0),rd=Atomics.load(r.h,1);while(rd<w){var o=rd&(this_RING-1),hb=new Uint8Array(4);' +
      'for(var k=0;k<4;k++)hb[k]=r.d[(o+k)&(this_RING-1)];var len=new DataView(hb.buffer).getUint32(0,true),b=new Uint8Array(len),s=(o+4)&(this_RING-1),a=Math.min(len,this_RING-s);' +
      'b.set(r.d.subarray(s,s+a));if(a<len)b.set(r.d.subarray(0,len-a),a);rd+=4+((len+3)&~3);Atomics.store(r.h,1,rd);this.feed(b);}}' +
      'process(_,outs){this.poll();var L=outs[0][0],R=outs[0][1]||outs[0][0],m=L.length,k=0;' +
      'if(this.prime&&this.avail<1600){L.fill(0);R.fill(0);}else{this.prime=false;' +
      'while(k<m&&this.q.length){var b=this.q[0],c=Math.min(m-k,(b.length>>1)-this.h);for(var x=0;x<c;x++){L[k+x]=b[2*(this.h+x)];R[k+x]=b[2*(this.h+x)+1];}' +
      'k+=c;this.h+=c;this.avail-=c;this.used+=c;if(this.h>=(b.length>>1)){this.q.shift();this.h=0;}}' +
      'if(k<m){for(;k<m;k++){L[k]=0;R[k]=0;}this.prime=true;this.gaps++;}}' +
      'if(++this.t>=25){this.t=0;this.port.postMessage({st:[this.used,this.gaps,this.drops,this.logs,this.pushed,this.nonSilent,this.peak],rs:this.a?this.a.stats():null});}return true;}}registerProcessor("mp4n-pcm",P);';
    var url = URL.createObjectURL(new Blob([src], { type: 'application/javascript' }));
    ctx.audioWorklet.addModule(url).then(function () {
      var node = new AudioWorkletNode(ctx, 'mp4n-pcm', { numberOfInputs: 0, numberOfOutputs: 1, outputChannelCount: [2] });
      node.connect(ctx.destination);
      audio.wlSent = 0; audio.wlUsed = 0;
      node.port.onmessage = function (e) {
        var d = e.data;
        if (d.ready) { audio.wlAud = true; log('audio: the worklet renders (' + (audio.ring ? 'SharedArrayBuffer ring' : 'postMessage') + ')'); return; }
        if (d.pcm) { if (audio.recLen < audio.rec.length) { var t = Math.min(d.pcm.length, audio.rec.length - audio.recLen); audio.rec.set(d.pcm.subarray(0, t), audio.recLen); audio.recLen += t; } return; }
        if (d.fail) { audio.ring = null; log('audio: the worklet cannot run the audio module (' + d.fail + '); rendering on the main thread'); return; }
        if (d.st) {
          audio.wlUsed = d.st[0]; audio.gaps = d.st[1];
          if (audio.wlAud) { audio.drops = d.st[2]; audio.wlLogs = d.st[3]; audio.pushed = d.st[4]; audio.nonSilent = d.st[5]; audio.peak = d.st[6]; audio.renderStats = d.rs; }
        }
      };
      audio.node = node;
      audioModuleToWorklet();
    }).catch(function (e) { log('audio worklet unavailable (' + e + '); using buffer sources'); });
  }
  function audioModuleToWorklet() {
    if (!audio.node || !audio.mod || audio.modSent || (audio.rec && !Q.get('audwl'))) return;   // ?audrec records the main-thread instance (&audwl=1: the worklet's, echoed back)
    audio.modSent = true;
    var sab = null;
    if (window.crossOriginIsolated && typeof SharedArrayBuffer === 'function') {
      try { sab = new SharedArrayBuffer(8 + RING); audio.ring = { h: new Int32Array(sab, 0, 2), d: new Uint8Array(sab, 8, RING) }; } catch (e) { sab = null; }
    }
    audio.node.port.postMessage({ mod: audio.modBytes.slice(0), sab: sab, echo: !!(audio.rec && Q.get('audwl')) });   // the bytes: a WebAssembly.Module does not reach a worklet in every browser
  }
  function audioModuleLoad() {
    fetch('gamecube/native/dist/audio/mp4audio.wasm').then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status); return r.arrayBuffer();
    }).then(function (b) { audio.modBytes = b; return WebAssembly.compile(b); }).then(function (mod) {
      audio.mod = mod; audio.main = mkAudio(mod); audioModuleToWorklet();
    }).catch(function (e) { log('audio module unavailable (' + e + '): no sound'); });
  }
  // one guest frame's log (ok = 0: it overflowed; the next frame resyncs)
  function audioLog(u8, ok, frames) {
    audio.logs = (audio.logs || 0) + 1; audio.logBytes = (audio.logBytes || 0) + u8.length;
    if (window.Mp4Room && Mp4Room.pushMuted()) { audio.muted += frames; return; }   // a re-simulated or hidden room frame: already heard / not shown
    if (!ok) { audio.overflows = (audio.overflows || 0) + 1; return; }
    if (audio.wlAud) {
      if (audio.ring) { if (!ringWrite(audio.ring, u8)) audio.ringFull = (audio.ringFull || 0) + 1; return; }
      var c = u8.slice(); audio.node.port.postMessage({ log: c.buffer }, [c.buffer]); return;
    }
    if (audio.main) { var pcm = audio.main.render(u8); if (pcm.length) audioPush(pcm, 32000, true); }
  }

  function audioPush(pcm, rate, unmuted) {
    if (!unmuted && window.Mp4Room && Mp4Room.pushMuted()) { audio.muted += pcm.length >> 1; return; }   // a re-simulated or hidden room frame: already heard / not shown
    var n = pcm.length >> 1, peak = 0, i;
    for (i = 0; i < pcm.length; i++) { var a = pcm[i] < 0 ? -pcm[i] : pcm[i]; if (a > peak) peak = a; }
    if (audio.rec && audio.recLen < audio.rec.length) { var take = Math.min(pcm.length, audio.rec.length - audio.recLen); audio.rec.set(pcm.subarray(0, take), audio.recLen); audio.recLen += take; }
    audio.pushed += n; if (peak > 64) audio.nonSilent += n; if (peak > audio.peak) audio.peak = peak;
    var ctx = audio.ctx; if (!ctx) return;
    if (audio.node && rate === 32000) {
      if (audio.wlSent - audio.wlUsed + n > 9600 + 2000) { audio.drops++; return; }   // > 300 ms queued (+ the 25-quantum report lag)
      var f = new Float32Array(n * 2);
      for (i = 0; i < n * 2; i++) f[i] = pcm[i] / 32768;
      audio.node.port.postMessage(f, [f.buffer]);
      audio.wlSent += n;
      return;
    }
    var b = ctx.createBuffer(2, n, rate), L = b.getChannelData(0), R = b.getChannelData(1);
    for (i = 0; i < n; i++) { L[i] = pcm[2 * i] / 32768; R[i] = pcm[2 * i + 1] / 32768; }
    var now = ctx.currentTime;
    if (audio.next < now + 0.01) { if (audio.next) audio.gaps++; audio.next = now + 0.05; }
    else if (audio.next > now + 0.3) { audio.drops++; return; }
    var src = ctx.createBufferSource(); src.buffer = b; src.connect(ctx.destination); src.start(audio.next);
    audio.next += n / rate;
  }

  var started = false;
  async function start() {
    if (started) return;
    started = true;
    btn.disabled = true;
    var room = window.Mp4Room ? Mp4Room.bootOpts() : null;   // inside a room: the shared epoch and a fresh card
    if (room) log('room: booting with the room\'s epoch and a fresh memory card');
    BUILD = (room && room.build && !Q.get('build')) ? room.build : buildFor(!!room);   // a room: rb/ (rollback) or the plain build (delay), mp4n_room.js decides
    window.__mp4n.build = BUILD;
    log('build: ' + BUILD);
    audioInit();
    audioModuleLoad();
    try {
      if (!navigator.gpu) throw new Error('this browser has no WebGPU');
      if (typeof DecompressionStream !== 'function') throw new Error('this browser has no DecompressionStream');
      window.__mp4n.phase = 'disc';
      var done = 0;
      status('Loading disc 0/' + PARTS.length);
      var parts = await Promise.all(PARTS.map(function (sx) {
        return inflate('gamecube/roms/MarioParty4.bin.parta' + sx + '.gz').then(function (b) {
          status('Loading disc ' + (++done) + '/' + PARTS.length); return new Uint8Array(b);
        });
      }));
      var id = String.fromCharCode.apply(null, parts[0].subarray(0, 6));
      var magic = new DataView(parts[0].buffer).getUint32(0x1C, false) >>> 0;
      if (id !== 'GMPE01' || magic !== 0xC2339F3D) throw new Error('disc is not Mario Party 4 (id ' + id + ')');
      log('disc ' + parts.reduce(function (n, p) { return n + p.length; }, 0) + ' B, ' + id);
      window.__mp4n.phase = 'module';
      status('Loading game');
      await loadScript(BUILD + 'mp4native.js');
      await loadScript('gamecube/native/mp4n_input.js');
      await loadScript('gamecube/native/mp4n_state.js');
      Mp4Input.attachTouch(document.querySelector('.stage'));
      var canvas = document.getElementById('canvas');
      var mod = await createMp4Native({
        canvas: canvas,
        mp4Disc: parts,
        mp4AudioPush: audioPush,
        mp4AudioLog: audioLog,
        // memory-card saves persist in IndexedDB (?nosave=1: a fresh card every visit — what a
        // netplay session or a determinism test wants, since a save is game state)
        preRun: [function (M) {
          if (Q.get('nosave') || room || !M.FS || !M.IDBFS) return;
          try {
            M.FS.mkdir('/partyboard');
            M.FS.mount(M.IDBFS, {}, '/partyboard');
            M.addRunDependency('mp4-saves');
            M.FS.syncfs(true, function (e) { if (e) log('saves: could not load (' + e + ')'); M.removeRunDependency('mp4-saves'); });
            setInterval(function () { M.FS.syncfs(false, function () {}); }, 5000);
            window.addEventListener('pagehide', function () { M.FS.syncfs(false, function () {}); });
          } catch (e) { log('saves: ' + e); }
        }],
        // the memory card as game memory (rolls back with the game): every room and ?nosave=1 run — a card that
        // starts fresh and is never kept. ?memcard=0|1 overrides (A/B: the file card does not roll back)
        mp4MemCard: Q.get('memcard') != null ? Q.get('memcard') === '1' : !!(Q.get('nosave') || room),
        mp4FifoSkip: Q.get('fifoskip') === '0' ? false : undefined,   // ?fifoskip=0: decode undrawn frames' GX FIFO too (aurora gx/fifo.cpp)
        mp4EpochSeconds: room ? room.epoch : Q.get('epoch') ? +Q.get('epoch') : undefined,
        mp4DebugMg: !room && Q.get('mg') ? +Q.get('mg') : undefined,   // crash sweep: boot straight into minigame N (401..463)
        mp4FbScale: Q.get('res') != null ? +Q.get('res') : undefined,   // ?res=N: render at N x 640x480 (0 = canvas pixels)
        mp4DebugBoard: !room && Q.get('board') ? +Q.get('board') : undefined,   // crash sweep: boot straight into Party Mode board N (0..5 = w01..w06, 6 = w10)
        mp4DebugTurns: !room && Q.get('turns') ? +Q.get('turns') : undefined,   // with ?board: the party's turn count (default 10)
        mp4DebugOvl: !room && Q.get('ovl') ? +Q.get('ovl') : undefined,   // crash sweep: boot straight into overlay index N (menus, Story mode, results)
        mp4InputLatch: function (frame, ptr) { var m = window.__mp4n.module; Mp4Input.latch(frame, ptr, m && m.HEAP32); },
        locateFile: function (p) { return BUILD + p; },
        print: function (t) { log(t); },
        printErr: function (t) { log(t); if (/\[(ERROR|FATAL)\]/.test(t)) window.__mp4n.errors.push(t); },
        onAbort: function (r) { window.__mp4n.phase = 'aborted'; window.__mp4n.errors.push('abort: ' + r); status('Stopped: ' + r); }
      });
      window.__mp4n.module = mod;
      window.__mp4n.phase = 'running';
      status('Running');
      canvas.focus();
      Mp4State.attach(mod);
      if (Q.get('hash')) Mp4State.hashEvery(+Q.get('hash') || 60);
      if (window.Mp4Room) Mp4Room.attach(mod);
      // ?frameskip=N: at most N undrawn frames in a row when behind (0 = always draw; default 3)
      if (Q.get('frameskip') != null && mod._mp4web_set_frameskip) mod._mp4web_set_frameskip(+Q.get('frameskip') || 0);
      startReadout(mod);
      mod.callMain([]);
    } catch (e) {
      window.__mp4n.phase = 'failed'; window.__mp4n.errors.push(String(e && e.message || e));
      status('Cannot start: ' + (e && e.message || e)); log(String(e && e.stack || e));
      btn.disabled = false; started = false;
    }
  }
  // Speed / headroom. Guest rate = guest frames per wall second / 60 — it must read 1.000x; below that
  // the host is not keeping up (the game is never sped up to compensate). Host ms per frame is the time
  // from the frame boundary to the next one minus the scheduled sleep: what producing one frame costs.
  // Headroom = 16.667 ms / host ms. Presented frames are the guest's 60, never more.
  // ADAPTIVE INTERNAL RESOLUTION. Aurora renders at the canvas's pixel size; on a weak GPU that fill is
  // the cost (measured on the toaster rig: ~0.38 us of GPU-process CPU per pixel per drawn frame). When the
  // GPU is measured to be behind — at least 20% of frames found no staging buffer free (a scratch frame:
  // the GPU had not finished the earlier ones) for 5 seconds running, after the first 20 s of play — rendering drops to the GameCube's own
  // 640x480 (scaled up when presented). Measured, never guessed from the device; one way (no oscillation);
  // ?res=N fixes the scale and turns this off. Rendering is not game state (the game never reads the EFB),
  // so consoles in a room may differ here.
  var RES = { hot: 0, done: Q.get('res') != null };
  function autoRes(c, p, df) {
    var mod = window.__mp4n.module;
    if (RES.done || !mod || !mod._mp4web_gpu_scratch_frames || !mod._mp4web_set_fb_scale) return;
    var sc = mod._mp4web_gpu_scratch_frames(), cv = document.getElementById('canvas');
    if (RES.sc == null || !cv) { RES.sc = sc; return; }
    var frac = (sc - RES.sc) / df; RES.sc = sc;
    if (cv.width * cv.height <= 640 * 480 * 1.1) return;   // already at (or below) native: nothing to gain
    if (c.f < 1200) return;   // not during boot / the first 20 s: pipeline creation stalls every GPU there
    RES.hot = frac >= 0.2 ? RES.hot + 1 : 0;
    if (RES.hot < 5) return;
    RES.done = true; window.__mp4n.autoRes = { at: c.f, scratchFrac: +frac.toFixed(2), canvas: [cv.width, cv.height] };
    mod._mp4web_set_fb_scale(1);
    log('render resolution: 640x480 (native) — the GPU could not keep up at ' + cv.width + 'x' + cv.height + ' (' + Math.round(frac * 100) + '% of frames undrawn for 5 s)');
  }
  function startReadout(mod) {
    var el = document.getElementById('readout'), prev = null;
    function snap() {
      var rm = window.Mp4Room && Mp4Room.active() ? Mp4Room.report() : null;
      // in a room the guest clock is the room's live frames; re-simulated frames are not new time
      return { t: performance.now(), f: rm && rm.armed ? rm.stats.live : mod._mp4web_total(), d: mod._mp4web_drawn ? mod._mp4web_drawn() : null, busy: mod._mp4web_busy_ms(), gpu: mod._mp4web_gpu_wait_ms(), re: mod._mp4web_reanchors(), rm: rm };
    }
    setInterval(function () {
      var c = snap();
      if (prev && c.f > prev.f) {
        var df = c.f - prev.f, dt = (c.t - prev.t) / 1000, rate = df / dt / 60, ms = (c.busy - prev.busy) / df, gpu = (c.gpu - prev.gpu) / df;
        var r = { guestRate: rate, framesPerSec: (c.d != null && prev.d != null) ? (c.d - prev.d) / dt : df / dt, hostMsPerFrame: ms, gpuWaitMsPerFrame: gpu, cpuMsPerFrame: ms - gpu, headroom: (1000 / 60) / ms, reanchors: c.re - prev.re, frames: c.f };
        window.__mp4n.rate = r;
        autoRes(c, prev, df);
        var roomTxt = '';
        if (c.rm && c.rm.armed) {
          var e = c.rm.engine || {};
          roomTxt = '<br>Room ' + (c.rm.role || '') + ' &middot; frame ' + c.rm.next + ' &middot; ' + (e.rollback ? 'rollback (window ' + e.rollback + ', 0 frames input delay)' : 'delay ' + e.delay) +
            ' &middot; ' + c.rm.stats.rollbacks + ' rewinds, ' + c.rm.stats.resim + ' frames re-run &middot; fingerprints compared ' + (e.hashesCompared || 0) +
            (c.rm.failed || e.desync ? ' <span class="warn">' + (c.rm.failed || 'DESYNC') + '</span>' : '');
        }
        el.innerHTML = '<b>Guest ' + rate.toFixed(3) + 'x</b>' + (rate < 0.995 ? ' <span class="warn">(host behind)</span>' : '') +
          ' &middot; ' + r.framesPerSec.toFixed(1) + ' frames/s presented &middot; host ' + ms.toFixed(2) + ' ms/frame (CPU ' + r.cpuMsPerFrame.toFixed(2) +
          ', GPU wait ' + gpu.toFixed(2) + ') &middot; <b>' + r.headroom.toFixed(2) + 'x headroom</b>' + roomTxt;
      }
      var go = document.getElementById('btnRoomGo');
      go.hidden = !(c.rm && c.rm.role === 'host' && !c.rm.armed && c.rm.seated >= 2);
      if (!go.hidden) go.textContent = 'Start with ' + c.rm.seated + ' players now';
      if (c.rm && c.rm.active && !c.rm.running && !(prev && c.f > prev.f)) {
        el.innerHTML = 'Room: ' + (c.rm.failed ? '<span class="warn">' + c.rm.failed + '</span>' : c.rm.armed ? 'holding at frame 0 until every player is ready' : 'waiting for the party');
      }
      prev = c;
    }, 1000);
  }
  // ---- browsers without WebGPU -------------------------------------------------------------------
  // This port draws only through WebGPU. lib/capability.js measures it by DOING it (adapter, device,
  // a configured canvas context — a present navigator.gpu proves nothing). Where it fails (older
  // Safari, Firefox without WebGPU, some Android / Xbox Edge) the visitor is sent to gamecube.html,
  // which runs Mario Party 4 on its recomp engine with a WebGL2 fallback, and is told why first.
  // ?forcenative=1 skips the check. A room is different: everyone in it must run the same engine,
  // so a native room cannot be joined from the recomp page — the note says so and links the lobby.
  var CAP = { checked: false, ok: true, why: null };
  function capOk(r) { var w = r && r.webgpu; return !!(w && w.adapter && w.device && w.canvasCtx && w.configured); }
  function capCheck() {
    if (Q.get('forcenative') === '1' || !window.Capability || !Capability.ready) { CAP.checked = true; return Promise.resolve(CAP); }
    return Capability.ready.then(function (r) {
      CAP.checked = true; CAP.ok = capOk(r);
      CAP.why = CAP.ok ? null : ((r && r.webgpu && r.webgpu.err) || 'no working WebGPU');
      window.__mp4n.cap = { ok: CAP.ok, why: CAP.why };
      return CAP;
    }, function () { CAP.checked = true; return CAP; });
  }
  function capRoute() {
    var note = document.getElementById('capNote');
    var inRoom = !!Q.get('np');
    btn.disabled = true;
    window.__mp4n.phase = 'no-webgpu';
    if (inRoom) {
      note.innerHTML = '<b>This browser can\'t run the native port</b> — it has no working WebGPU (<span class="why"></span>). ' +
        'Everyone in a room runs the same engine, so this room can\'t be joined from here. Ask the host to open a ' +
        '<a href="/multiplayer.html">GameCube-engine Mario Party 4 room</a> instead, which runs without WebGPU, ' +
        'or open this link in Chrome or Edge on a computer. <a href="?forcenative=1">Try anyway</a>';
      status('This browser has no WebGPU');
    } else {
      var target = '/gamecube.html';
      note.innerHTML = '<b>Your browser has no working WebGPU</b> (<span class="why"></span>), which this native port needs. ' +
        'Mario Party 4 also runs on the site\'s GameCube engine without it — opening that now. ' +
        '<a href="' + target + '">Open it now</a> &middot; <a href="?forcenative=1">Try the native port anyway</a>';
      status('Opening the GameCube engine…');
      try { localStorage.setItem('gcwasm_romIdx', '0'); } catch (e) {}   // gamecube.html ROMS[0] is Mario Party 4
      if (Q.get('noredirect') !== '1') setTimeout(function () { location.href = target; }, 4000);
    }
    note.querySelector('.why').textContent = CAP.why;
    note.hidden = false;
    log('capability: no WebGPU (' + CAP.why + ') — ' + (inRoom ? 'room cannot be joined here' : 'routing to gamecube.html'));
  }
  var startRequested = false;
  var startGated = function () {
    if (startRequested) return; startRequested = true;
    capCheck().then(function () { if (CAP.ok) start(); else capRoute(); });
  };
  capCheck().then(function () { if (!CAP.ok) capRoute(); });

  btn.addEventListener('click', function () { capCheck().then(function () { if (CAP.ok) start(); else capRoute(); }); });
  document.getElementById('btnRoomGo').addEventListener('click', function () { if (window.Mp4Room) Mp4Room.startNow(); });
  // ?np=<CODE>&game=<key>[&join=1][&players=2-4][&net=local]: handed a room by multiplayer.html (or
  // opened from the Party button). The game starts by itself once the party has connected; frame 0
  // runs when every seated player is holding at it.
  var NP = { np: Q.get('np'), game: Q.get('game'), join: Q.get('join') === '1', players: Q.get('players') };
  if (window.Mp4Room && Mp4Room.mount({ log: log, onStart: startGated, handoff: NP })) {
    var ho = Mp4Room._R.handoff;
    if (ho) { status((ho.join ? 'Joining' : 'Hosting') + ' room ' + ho.code + ' — waiting for ' + (ho.join ? 'the host' : ho.players + ' players')); log('room: handed ' + ho.code + ' for ' + (ho.game || 'Mario Party 4') + (ho.join ? ' (joining)' : ' (hosting, ' + ho.players + ' players)')); }
  }
  if (Q.get('autostart') === '1') startGated();
})();
</script>
