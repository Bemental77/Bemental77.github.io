name: Deploy to GitHub Pages

# This replaces the default GH Pages deploy. The repo includes ~10 GB of dev sources
# (emsdk, pcsx-wasm-src, gamecube/dolphin-src, bementalJIT, build artifacts) that aren't
# needed at runtime. We stage a minimal artifact and only ship what the deployed site serves.

on:
  push:
    branches: [prod]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Cancel a running deploy if a newer push lands.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout (shallow)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: false

      - name: Stage deploy artifact
        run: |
          set -e
          mkdir -p _deploy
          # Copy only files that need to be served at runtime. Big dev-only paths excluded.
          # Runtime files inside gamecube/dolphin-bridge/ etc. ARE kept (loaded by gamecube.html).
          rsync -a --delete \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.claude' \
            --exclude='_deploy' \
            --exclude='emsdk' \
            --exclude='node_modules' \
            --exclude='*.tsbuildinfo' \
            --exclude='ps1/ps1Wasm/pcsx-wasm-src' \
            --exclude='ps1/ps1Wasm/wasmpsx-repo' \
            --exclude='bementalJIT' \
            --exclude='gamecube/dolphin-src' \
            --exclude='gamecube/build-*' \
            --exclude='gamecube/ppc-worker/build-*' \
            --exclude='gamecube/tools' \
            --exclude='gamecube/roms' \
            --exclude='dolphin_captures' \
            --exclude='research_findings.md' \
            --exclude='tools' \
            --exclude='build-*' \
            --exclude='*.iso' \
            --exclude='*.bin.bak' \
            --exclude='*.o' \
            --exclude='*.a' \
            --exclude='*.tsbuildinfo' \
            --exclude='Makefile*' \
            --exclude='handler.js' \
            --exclude='serverless.yml' \
            --exclude='send.email.js' \
            --exclude='send.email.ts' \
            ./ _deploy/
          echo "::group::Deploy artifact size + top dirs"
          du -sh _deploy
          du -sh _deploy/* | sort -h | tail -20
          echo "::endgroup::"
          echo "::group::Deploy file count"
          find _deploy -type f | wc -l
          echo "::endgroup::"

      - name: Configure Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _deploy

      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
