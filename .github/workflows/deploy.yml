name: Deploy to GitHub Pages

# ⚠ GITHUB PAGES HAS A HARD 10 GB DEPLOY LIMIT AND THIS SITE IS AT IT.
# Run #167 (commit 4ee03d8d) failed with, verbatim:
#   Artifact could not be deployed. Please ensure the content does not contain
#   any hard links, symlinks and total size is less than 10GB.
# Upload succeeded; DEPLOY is where it died. The artifact was ~14.07 GB after four
# Dreamcast discs were added. Content, measured from the prod tree:
#   dreamcast/discs 5.3 GB | ps1/ps1Wasm 4.4 GB | gamecube/roms 3.4 GB
# None of it is waste — there is no redundancy (checked: no file is tracked both
# whole and split into parts). So the ceiling is structural, not a cleanup problem.
# The four NEW discs are excluded below; the files stay in git, so re-enabling is
# deleting four lines. Dev-only cuts sit alongside them (dreamcast/states keeps ONLY
# pso2_boot.state, the sole state dreamcast.html fetches — verified by grep).
#
# RESOLVED: every disc AND both ROM libraries are now gzipped and inflated by the
# pages that fetch them. Measured, all five discs included: 9.06 GB.
#   dreamcast/discs 5.32 -> 2.52 GB   ps1/ps1Wasm 4.39 -> 2.77 GB
#   gamecube/roms   3.29 -> 2.70 GB
# Nothing is excluded for size any more. If this creeps back toward 10 GB the next
# lever is n64/N64Wasm (870 MB, still raw).
#
# This replaces the default GH Pages deploy. The repo includes ~10 GB of dev sources
# (emsdk, pcsx-wasm-src, gamecube/dolphin-src, bementalJIT, build artifacts) that aren't
# needed at runtime. We stage a minimal artifact and only ship what the deployed site serves.

on:
  push:
    branches: [prod]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# ⚠ NOT AT WORKFLOW LEVEL, AND NOT CANCELLING A DEPLOY THAT IS PUBLISHING.
# Together with the decide job this produced a site that silently stopped
# updating, which is worse than a slow deploy:
#   762682c1 (a real page fix)  -> run CANCELLED by the next push
#   778fe23f, 72ab3cf9, 5f9feabf -> each CANCELLED by the next push
#   6aff7958 (tools only)        -> decide=false, deploy job SKIPPED
#                                   run conclusion: SUCCESS
# Five green-looking runs, nothing published, and the live page sat at d80aac9b
# while the user kept reporting a bug that was fixed and pushed. A workflow-level
# group let a run that was NEVER GOING TO DEPLOY cancel one that was mid-upload,
# and then decline to take its place.
#
# So the group is on the deploy JOB only — a decide-only run cannot cancel a
# publish — and cancel-in-progress is off, because this deploy's cost means a
# cancellation is very likely to be the last word rather than a superseded one.
# The decide job is what stops needless deploys now; that is its whole purpose.

jobs:
  # ---------------------------------------------------------------------------
  # IS THERE ANYTHING TO DEPLOY? Measured on run 34241436456, one deploy of this
  # repo costs: checkout 199 s, stage 74 s, upload 328 s, deploy 217 s = 821 s
  # for a ~9.9 GB artifact. Two of the six commits before this change touched
  # ONLY tools/, which has never been part of the artifact — those runs uploaded
  # 9.9 GB to publish nothing, and cancelled each other on the way in (this
  # workflow's concurrency group has cancel-in-progress).
  #
  # The check reads deploy.exclude — the SAME file rsync is handed below as
  # --exclude-from — so the two can never disagree. A `paths-ignore:` list here
  # would have been a second copy, and a drifted copy does not over-deploy, it
  # SILENTLY SKIPS a deploy that was needed. `filter: blob:none` fetches history
  # without file contents, so this job is cheap on a repo this size.
  # ---------------------------------------------------------------------------
  decide:
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.check.outputs.deploy }}
    steps:
      # ⚠ NOT `fetch-depth: 0`. The first version of this job used a full
      # blobless clone and took 143 s to answer a yes/no question (run
      # 34248235082, 15:59:39 -> 16:02:02) — overhead charged to EVERY deploy,
      # which eats much of what skipping a needless one saves. Only two commits
      # are ever compared, so only two are fetched.
      - name: Checkout (shallow)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          lfs: false

      - name: Does this push touch anything the site serves?
        id: check
        run: |
          set -e
          if [ "${{ github.event_name }}" != "push" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            echo "Not a push (${{ github.event_name }}) — deploying."
            exit 0
          fi
          # ⚠ COMPARE AGAINST WHAT IS PUBLISHED, NOT AGAINST THE PREVIOUS PUSH.
          # "Did this push change anything?" is the wrong question whenever the
          # last deploy did not happen — cancelled, skipped, or failed. Asking it
          # is what let the site sit at d80aac9b through five later commits: each
          # push only looked one step back, saw nothing of its own to publish,
          # and never noticed the fix four commits earlier had never gone out.
          # The github-pages environment records the commit that actually
          # deployed, so that is the baseline. It self-heals: a missed deploy is
          # simply still pending next time.
          LIVE=$(GH_TOKEN="${{ github.token }}" gh api "repos/${{ github.repository }}/deployments?environment=github-pages&per_page=1" \
                   --jq '.[0].sha' 2>/dev/null || true)
          if [ -n "$LIVE" ] && [ "$LIVE" != "null" ]; then
            git fetch --no-tags --filter=blob:none --depth=1 origin "$LIVE" 2>/dev/null || true
          fi
          if [ -n "$LIVE" ] && [ "$LIVE" != "null" ] && git cat-file -e "$LIVE^{commit}" 2>/dev/null; then
            echo "Baseline = last PUBLISHED commit $LIVE"
            BEFORE="$LIVE"
          else
            echo "No usable published commit (got '$LIVE') — falling back to the previous push."
            BEFORE="${{ github.event.before }}"
          fi
          # Fetch just the one commit we are diffing against, without its file
          # contents. If it is unreachable — force-push, or history rewritten —
          # this fails and the guard below deploys, which is the safe answer.
          if [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            git fetch --no-tags --filter=blob:none --depth=1 origin "$BEFORE" 2>/dev/null || true
          fi
          git cat-file -e "$BEFORE^{commit}" 2>/dev/null || echo "(baseline $BEFORE not reachable — the guard below will deploy)"
          # A new branch, a force-push past what we have, or a first run: the
          # honest answer is "we do not know what changed", and the safe answer
          # is to deploy.
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            echo "No usable previous commit ($BEFORE) — deploying."
            exit 0
          fi
          git diff --name-only "$BEFORE" "${{ github.sha }}" > /tmp/changed.txt
          echo "--- changed files ---"; cat /tmp/changed.txt
          echo "---------------------"
          node tools/deploy_should_run.mjs < /tmp/changed.txt | tee /tmp/decision.txt
          grep -E '^deploy=(true|false)$' /tmp/decision.txt >> "$GITHUB_OUTPUT"

  deploy:
    needs: decide
    if: needs.decide.outputs.deploy == 'true'
    concurrency:
      group: pages
      cancel-in-progress: false
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout (shallow)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: false

      - name: Stage deploy artifact
        run: |
          set -e
          mkdir -p _deploy
          # Copy only files that need to be served at runtime. Big dev-only paths excluded.
          # Runtime files inside gamecube/dolphin-bridge/ etc. ARE kept (loaded by gamecube.html).
          # ⚠ ONE LIST, TWO READERS. deploy.exclude is also read by
          # tools/deploy_should_run.mjs in the decide job above, so "what the
          # site serves" is defined in exactly one place. Do not re-inline these
          # patterns here.
          rsync -a --delete --exclude-from=deploy.exclude \
            --exclude='/deploy.exclude' \
            ./ _deploy/
          echo "::group::Deploy artifact size + top dirs"
          du -sh _deploy
          du -sh _deploy/* | sort -h | tail -20
          echo "::endgroup::"
          echo "::group::Deploy file count"
          find _deploy -type f | wc -l
          echo "::endgroup::"

      - name: Verify runtime assets survived the exclude list
        # Two shipped features were silently dead in production because the rsync
        # excludes above stripped assets that runtime code fetches:
        #   dolphin_captures/sab.map      -> SAB booted with ~258 symbols, HLE
        #                                    patches did not install, OSPanic
        #                                    reached PPCHalt
        #   n64/bementalJIT/mips_emit.js  -> the N64 JIT could never load; an
        #                                    rsync pattern with no leading slash
        #                                    matches ANY path component
        # Both were present in git and on prod and returned 404 live, which no
        # repo-side check can see. This asserts against the STAGED ARTIFACT,
        # which is the only place the deletion is observable.
        run: node tools/verify_deploy_assets.mjs _deploy

      - name: Configure Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _deploy

      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
