<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SM64 Daily Parkour</title>
<style>
  :root { --bg:#0d0f16; --panel:#181c28; --line:#2c3346; --text:#e8ecf4; --mute:#9aa4b8; --red:#e63b2e; --gold:#ffc81e; --green:#3cd05a; color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 15px/1.45 system-ui, -apple-system, sans-serif; }
  #wrap { position: relative; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; overflow: hidden; }
  canvas { width: min(100vw, calc(100vh * 4 / 3)); height: min(100vh, calc(100vw * 3 / 4)); display: block; background: #000; outline: none; }
  #card { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(8,10,16,.84); z-index: 5; padding: 16px; }
  #card[hidden] { display: none; }
  .box { width: 100%; max-width: 440px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 20px 22px; }
  h1 { margin: 0 0 2px; font-size: 24px; } .sub { color: var(--mute); margin: 0 0 14px; }
  .row { display: flex; justify-content: space-between; margin: 4px 0; }
  .big { font: 700 32px/1.2 ui-monospace, Menlo, monospace; margin: 6px 0; }
  .legend { display: flex; gap: 10px; flex-wrap: wrap; margin: 10px 0 0; color: var(--mute); font-size: 13px; }
  .sw { display: inline-block; width: 11px; height: 11px; border-radius: 3px; margin-right: 4px; vertical-align: -1px; }
  button { font: 600 15px system-ui, sans-serif; padding: 10px 18px; border-radius: 9px; border: 0; cursor: pointer; margin: 14px 8px 0 0; }
  .go { background: var(--red); color: #fff; } .alt { background: #2c3346; color: var(--text); }
  pre { background: #0f121a; padding: 10px; border-radius: 8px; white-space: pre-wrap; font: 14px/1.4 ui-monospace, Menlo, monospace; margin: 12px 0 0; }
  kbd { background: #0f121a; border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; font: 12px ui-monospace, Menlo, monospace; }
  #bar { position: absolute; top: 8px; right: 8px; z-index: 4; display: flex; gap: 6px; }
  #bar button { margin: 0; padding: 6px 10px; font-size: 13px; background: rgba(24,28,40,.85); color: var(--text); border: 1px solid var(--line); }
  #status { position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%); color: var(--mute); font-size: 13px; z-index: 4; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="canvas" tabindex="-1" oncontextmenu="event.preventDefault()"></canvas>
  <div id="bar" hidden><button id="restart" title="Restart (Backspace)">↺ Restart</button></div>
  <div id="status"></div>
  <div id="card"><div class="box" id="box"></div></div>
</div>
<script>
(function () {
  'use strict';
  var EPOCH = '2026-10-23', STORE = 'sm64daily.v3';
  var qs = new URLSearchParams(location.search);
  function dateKey(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
  function hash(s) { var h = 2166136261 >>> 0; for (var i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; } return h; }
  // A shared ghost link carries its own date, so a friend always races on the same course.
  var hashArgs = new URLSearchParams(location.hash.slice(1));
  var today = hashArgs.get('d') || qs.get('date') || dateKey(new Date());
  var dayNo = Math.round((Date.parse(today + 'T00:00:00Z') - Date.parse(EPOCH + 'T00:00:00Z')) / 86400000) + 1;
  var dow = new Date(today + 'T12:00:00').getDay();
  var DIFF = ['Hard', 'Easy', 'Easy', 'Medium', 'Medium', 'Hard', 'Hard'][dow];
  var seed = hash('sm64daily:' + today) | 0;
  // Read by src/game/daily.c when the course is built.
  window.sm64DailySeed = seed;
  window.sm64DailyDow = dow;
  window.sm64DailyNumber = dayNo;
  if (qs.has('host')) window.sm64DailyHostOverride = +qs.get('host');   // test hook: build over a given world

  // Same table and formula as daily.c (sHosts / daily_host_level), so the card can name today's world before boot.
  var HOSTS = ['Castle Grounds', "Bob-omb Battlefield", "Whomp's Fortress", 'Jolly Roger Bay', 'Cool, Cool Mountain', 'Shifting Sand Land',
    'Lethal Lava Land', "Snowman's Land", 'Tall, Tall Mountain', 'Tiny-Huge Island', 'Rainbow Ride',
    'Bowser in the Dark World', 'Bowser in the Fire Sea', 'Bowser in the Sky', 'Dire, Dire Docks', 'Castle Courtyard'];
  var hostIdx = qs.has('host') ? (+qs.get('host')) % HOSTS.length : ((Math.imul(seed, 2654435761 | 0) >>> 0) >>> 8) % HOSTS.length;
  // Same order as daily.c's MD_* enum.
  var MODULES = [['Hop', '🟦'], ['Moving platform', '🌀'], ['Platform chain', '⚙️'], ['Thwomp', '🪨'], ['Pendulum', '🕰️'],
    ['Fire bars', '🔥'], ['Long jump', '🏃'], ['Backflip ledge', '🤸'], ['Triple jump', '⏫'], ['Wall kick', '🧱'], ['Pole climb', '🎋'], ['Slide', '🛝']];

  var $ = function (id) { return document.getElementById(id); };
  function load() { try { return JSON.parse(localStorage.getItem(STORE)) || { days: {} }; } catch (e) { return { days: {} }; } }
  function save(s) { try { localStorage.setItem(STORE, JSON.stringify(s)); } catch (e) {} }
  function better(a, b) { return !b || (a.done && !b.done) || (a.done && b.done && a.frames < b.frames) || (!a.done && !b.done && a.plats > b.plats); }
  function fmt(f) { var s = f / 30, m = Math.floor(s / 60); s -= m * 60; return m + ':' + (s < 10 ? '0' : '') + s.toFixed(2); }
  function streak(s) { var n = 0, d = new Date(today + 'T12:00:00'); while (s.days[dateKey(d)] && s.days[dateKey(d)].best && s.days[dateKey(d)].best.done) { n++; d.setDate(d.getDate() - 1); } return n; }
  function bestText(b, total) { return b.done ? fmt(b.frames) : b.plats + '/' + total; }
  function moduleIcons() { return (window.sm64DailyModules || []).filter(function (m) { return m !== 0; }).map(function (m) { return MODULES[m][1]; }).join(''); }
  function card(html) { $('box').innerHTML = html; $('card').hidden = false; }
  function esc(t) { return String(t).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

  // ── runs: a run is Mario's path at 15 Hz (x, y, z, yaw as int16), from daily.c's recorder ──
  function b64u(bytes) { var s = ''; for (var i = 0; i < bytes.length; i++) s += String.fromCharCode(bytes[i]); return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); }
  function unb64u(t) { var s = atob(t.replace(/-/g, '+').replace(/_/g, '/')), b = new Uint8Array(s.length); for (var i = 0; i < s.length; i++) b[i] = s.charCodeAt(i); return b; }
  async function pipe(bytes, Stream) { return new Uint8Array(await new Response(new Blob([bytes]).stream().pipeThrough(new Stream('deflate-raw'))).arrayBuffer()); }
  // Delta-encode each channel (small numbers), then deflate: a 2-minute run fits in a link.
  async function packRun(rec) {
    var d = new Int16Array(rec.length);
    for (var i = 0; i < rec.length; i++) d[i] = i < 4 ? rec[i] : (rec[i] - rec[i - 4]) | 0;
    return b64u(await pipe(new Uint8Array(d.buffer), CompressionStream));
  }
  async function unpackRun(text) {
    var raw = await pipe(unb64u(text), DecompressionStream), d = new Int16Array(raw.buffer, 0, raw.length >> 1), out = new Int16Array(d.length);
    for (var i = 0; i < d.length; i++) out[i] = i < 4 ? d[i] : (out[i - 4] + d[i]) | 0;
    return out;
  }
  function readRecording() {
    var n = Module._daily_rec_count(), p = Module._daily_rec_ptr();
    return new Int16Array(Module.HEAP16.buffer, p, n * 4).slice();
  }
  var ghost = null, ghostName = hashArgs.get('n') || '', ghostFrames = +(hashArgs.get('t') || 0);
  function installGhost(rec) {
    if (!rec || !Module._malloc) return;
    var p = Module._malloc(rec.length * 2);
    Module.HEAP16.set(rec, p >> 1);
    Module._daily_set_ghost(p, rec.length / 4);
  }
  async function shareLink(run) {
    var name = (localStorage.getItem('sm64daily.name') || '').slice(0, 16);
    var h = 'd=' + today + '&t=' + run.frames + (name ? '&n=' + encodeURIComponent(name) : '') + '&g=' + run.path;
    return location.origin + location.pathname + '#' + h;
  }

  var started = false, total = 0;
  function intro() {
    var s = load(), d = s.days[today];
    card('<h1>SM64 Daily Parkour #' + dayNo + '</h1><p class="sub">' + today + ' · ' + esc(HOSTS[hostIdx]) + ' · ' + DIFF + '</p>'
      + (ghost ? '<p><b>Racing ' + (ghostName ? esc(ghostName) + '\'s' : 'a friend\'s') + ' ghost</b>' + (ghostFrames ? ' (' + fmt(ghostFrames) + ')' : '') + ' — the white shadow.</p>' : '')
      + '<p>New course, new world, every day. Reach the <b>Power Star</b>. <span style="color:var(--green)">Green</span> = checkpoint.</p>'
      + (d && d.best ? '<div class="row" style="margin-top:12px"><span>Your best today</span><b>' + bestText(d.best, d.total) + '</b></div>' : '')
      + '<div class="row"><span>Streak</span><b>' + streak(s) + '</b></div>'
      + '<button class="go" id="play">' + (d ? 'Play again' : 'Play') + '</button>' + KEYS);
    $('play').onclick = play;
  }
  var KEYS = '<p class="sub" style="margin-top:12px"><kbd>WASD</kbd> move · <kbd>Space</kbd> A · <kbd>K</kbd> Z · <kbd>J</kbd> B · <kbd>←↑→↓</kbd> camera · <kbd>⌫</kbd> restart · 🎮 <kbd>A</kbd>/<kbd>Start</kbd> play, <kbd>View</kbd> restart</p>';
  function play() {
    if (started) { $('card').hidden = true; Module._daily_restart(); $('canvas').focus(); return; }
    started = true;
    card('<h1>SM64 Daily Parkour #' + dayNo + '</h1><p class="sub">Loading…</p>');
    var s = document.createElement('script'); s.src = 'sm64.us.js'; s.onerror = function () { card('<h1>Could not load the game</h1><p>Reload to try again.</p>'); };
    document.body.appendChild(s);
  }
  window.Module = {
    canvas: $('canvas'),
    print: function () {}, printErr: function (t) { console.warn(t); },
    setStatus: function (t) { $('status').textContent = t || ''; },
  };
  window.sm64DailyReady = function (stations) {
    total = stations - 1;
    installGhost(ghost);
    $('card').hidden = true; $('bar').hidden = false; $('canvas').focus();
  };
  window.sm64DailyResult = function (done, frames, plats, n) {
    total = n;
    var res = { done: !!done, frames: frames, plats: plats };
    var rec = readRecording();
    var s = load(), d = s.days[today] || (s.days[today] = { attempts: 0 });
    d.attempts++; d.total = n; d.host = hostIdx; d.icons = moduleIcons();
    var nb = better(res, d.best);
    var shareText = function () {
      return 'SM64 Daily Parkour #' + dayNo + ' · ' + HOSTS[hostIdx] + '\n' + (d.icons || '') + '\n⏱ ' + bestText(d.best, n)
        + (ghostFrames && d.best.done ? (d.best.frames < ghostFrames ? '  🏁 beat ' : '  👻 lost to ') + (ghostName || 'the ghost') + ' (' + fmt(ghostFrames) + ')' : '')
        + '\n' + location.origin + location.pathname;
    };
    var finish = function () {
      save(s);
      setTimeout(function () {
        card('<h1>' + (done ? 'Finished!' : 'Run over') + '</h1><div class="big">' + bestText(res, n) + '</div>'
          + '<div>' + (d.icons || '') + (nb ? ' · <b>new best</b>' : '') + '</div>'
          + (ghostFrames ? '<div class="row" style="margin-top:10px"><span>' + (ghostName ? esc(ghostName) : 'Ghost') + '</span><b>' + fmt(ghostFrames) + '</b></div>' : '')
          + '<div class="row" style="margin-top:10px"><span>Best today</span><b>' + bestText(d.best, n) + '</b></div>'
          + '<div class="row"><span>Attempts</span><b>' + d.attempts + '</b></div><div class="row"><span>Streak</span><b>' + streak(s) + '</b></div>'
          + '<pre id="share">' + esc(shareText()) + '</pre>'
          + '<div class="row" style="margin-top:10px"><span>Your name on shared runs</span><input id="name" maxlength="16" placeholder="optional" style="width:150px;background:#0f121a;color:var(--text);border:1px solid var(--line);border-radius:6px;padding:4px 6px"></div>'
          + '<button class="go" id="again">Try again</button><button class="alt" id="copy">Copy result</button>'
          + (d.best && d.best.path ? '<button class="alt" id="link">Share my run (ghost link)</button>' : ''));
        $('name').value = localStorage.getItem('sm64daily.name') || '';
        $('name').onchange = function () { try { localStorage.setItem('sm64daily.name', $('name').value.trim()); } catch (e) {} };
        $('again').onclick = play;
        var send = function (t, btn) {
          var p = (navigator.share && /Mobi/.test(navigator.userAgent)) ? navigator.share({ text: t }) : navigator.clipboard.writeText(t);
          p.then(function () { btn.textContent = 'Copied'; }, function () {});
        };
        $('copy').onclick = function () { send(shareText(), $('copy')); };
        if ($('link')) $('link').onclick = function () { shareLink(d.best).then(function (u) { send(shareText().replace(location.origin + location.pathname, u), $('link')); }); };
      }, done ? 1500 : 600);
    };
    if (nb) {
      d.best = res;
      // Save the run itself with the best, so it can be shared as a ghost.
      if (done && rec.length) packRun(rec).then(function (p) { d.best.path = p; finish(); }, finish); else finish();
    } else finish();
  };
  $('restart').onclick = function () { if (window.Module && Module._daily_restart) { $('card').hidden = true; Module._daily_restart(); $('canvas').focus(); } };
  document.addEventListener('keydown', function (e) {
    if (e.code === 'Backspace' && window.Module && Module._daily_restart && $('card').hidden) { e.preventDefault(); Module._daily_restart(); }
  });
  // Controller: A or Start presses the card's main button (Play / Try again); View/Back restarts a run.
  // In-game the controller is read by the game itself (SDL), so only the page's own buttons live here.
  var padPrev = {};
  (function pollPads() {
    var pads = navigator.getGamepads ? navigator.getGamepads() : [];
    for (var i = 0; i < pads.length; i++) {
      var g = pads[i]; if (!g) continue;
      var now = { a: !!(g.buttons[0] && g.buttons[0].pressed), start: !!(g.buttons[9] && g.buttons[9].pressed), back: !!(g.buttons[8] && g.buttons[8].pressed) };
      var was = padPrev[i] || {};
      if (((now.a && !was.a) || (now.start && !was.start)) && !$('card').hidden) {
        var go = $('card').querySelector('button.go');
        if (go) go.click();
      }
      if (now.back && !was.back && window.Module && Module._daily_restart && $('card').hidden) Module._daily_restart();
      padPrev[i] = now;
    }
    requestAnimationFrame(pollPads);
  })();
  if (hashArgs.get('g')) unpackRun(hashArgs.get('g')).then(function (r) { ghost = r; intro(); }, intro); else intro();
})();
</script>
</body>
</html>
